[package]
name = "triforge-macros"
version = "0.1.0"
edition = "2021"
description = "Triforge 过程宏 —— #[derive(App)] 和 #[derive(ValueEnum)]"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
triforge-core = { path = "../triforge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
