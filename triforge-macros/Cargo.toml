[package]
name = "triforge-macros"
version = "0.1.0"
edition = "2021"
description = "Triforge proc macros — #[derive(App)] and #[derive(ValueEnum)]"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"
keywords = ["macro", "derive", "cli", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
triforge-core = { path = "../triforge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
