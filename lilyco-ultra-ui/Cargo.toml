[package]
name = "lilyco-ultra-ui"
version.workspace = true
edition = "2021"
description = "Lilyco Ultra UI — Excel-style declarative JSON → React UI. Validates the lilyco framework's low-code approach."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"
keywords = ["web", "gui", "react", "low-code", "json"]
categories = ["web-programming", "gui"]

[dependencies]
lilyco-core = { version = "0.3", path = "../lilyco-core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
webbrowser = "1"
