[package]
name = "lilyco-grep"
version = "0.1.0"
edition = "2021"
description = "Lilyco demo — a simple recursive grep, four interfaces + AI-callable by default"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"

[[bin]]
name = "lgrep"
path = "src/main.rs"

[dependencies]
lilyco = { path = "../lilyco" }
# derive(App) 宏展开引用 lilyco_core::… 路径，binary 需要能解析到它
lilyco-core = { path = "../lilyco-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
