[package]
name = "lilyco-grep"
version.workspace = true
edition = "2021"
description = "Lilyco demo — a simple recursive grep, four interfaces + AI-callable by default"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"

[[bin]]
name = "lgrep"
path = "src/main.rs"

[dependencies]
lilyco = { path = "../lilyco" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
