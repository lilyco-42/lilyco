[package]
name = "lilyco-float"
version = "0.1.0"
edition = "2021"
description = "lilyco 桌面悬浮弹幕/歌词层插件（GTK3 + 托盘），可被任意 lilyco 应用复用"
license = "MIT"

[features]
default = []
gtk = ["dep:gtk"]
http = ["dep:reqwest"]
tray = ["gtk", "dep:ksni", "dep:webbrowser"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
gtk = { version = "0.18", optional = true }
ksni = { version = "0.2", optional = true }
webbrowser = { version = "1", optional = true }

[dev-dependencies]