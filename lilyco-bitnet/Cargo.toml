[package]
name = "lilyco-bitnet"
version.workspace = true
edition = "2021"
description = "Lilyco P3 采样桥 — bitnet-rs 本地 BitNet b1.58 推理实现 HostBridge，全离线 LLM 闭环"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"

[[bin]]
name = "lbitnet"
path = "src/main.rs"

[dependencies]
# default-features = false → headless（CLI + MCP），与 lilyco-plc 等工具族一致
lilyco = { path = "../lilyco", default-features = false }
serde_json = "1"
# 本地 BitNet b1.58 推理引擎（进程内 lib 复用，非子进程）
# bitnet-rs 已锁 rev（feat/model-api 已 squash 合并进 main）
bitnet-rs = { git = "https://github.com/lilyco-42/bitnet-rs", rev = "6e12ab9e8ad4c99a88cd0ffec9f0d08b1d507f31" }
