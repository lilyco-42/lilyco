[package]
name = "lilyco-chatgpt"
version.workspace = true
edition = "2021"
description = "lchatgpt — 把 chatgpt.com 账号后端写成 CLI：会话历史只读查询 + codex responses 提问，四端 (CLI / TUI / Web / MCP) + AI 可调"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"
keywords = ["cli", "mcp", "chatgpt", "openai"]
categories = ["command-line-interface", "development-tools"]

[[bin]]
name = "lchatgpt"
path = "src/main.rs"

[dependencies]
# 应用 crate 只依赖 facade：core 的类型走 lilyco::prelude::*，
# derive(App) 默认展开成 ::lilyco::__core::…（要绕开 facade 用 #[app(crate = "lilyco_core")]）
lilyco = { version = "0.3", path = "../lilyco", optional = true, default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 与 lilyco-web2cli 同一个 HTTP 栈：ureq 3 + rustls + ring，纯 Rust，
# 不拉 C 工具链（musl / aarch64-linux-android 都能编）
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }
# 可选的浏览器登录态抓取：CDP 走 websocket。只用 handshake（本机 ws:// 不需要 TLS），
# 它是纯 Rust，不启动也不链接任何浏览器 —— 二进制里没有 chromium/ego-lite 依赖。
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# `serve`：把同样的能力吐成 OpenAI 兼容的 /v1/*，给 dsh（DeepSeek Harness）这类
# 客户端当模型提供端用。与 lilyco-web2cli 同一个 HTTP 栈（axum 0.8 + tokio，已在
# workspace 的 Cargo.lock 里），optional —— 不要这个能力就 --no-default-features。
axum = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net"], optional = true }
async-stream = { version = "0.3", optional = true }

[features]
default = ["full"]
# 全功能（CLI + TUI + Web + MCP）
full = ["dep:lilyco", "lilyco/full", "server"]
# OpenAI 兼容 HTTP 端（`lchatgpt serve`）
server = ["dep:axum", "dep:tokio", "async-stream"]
# Android/Termux：headless（CLI + MCP）
android = ["dep:lilyco"]

# ── cargo binstall ────────────────────────────────────────
# 只有 crate 发布且 CI 真的产出该资产时才有效；资产命名 `{ name }-{ target }{ binary-ext }`
# （完整 target triple）、pkg-fmt = "bin"（下载的单文件即二进制）。
# 坑：`{ name }` 展开成**包名**（lilyco-<域>），而 CI 的 staging 现在按**二进制名**
# （l<域>-…）发布，两者对不上 → binstall 只会 404 回退源码编译。
[package.metadata.binstall]
pkg-url = "https://github.com/lilyco-42/lilyco/releases/download/v{ version }/{ name }-{ target }{ binary-ext }"
pkg-fmt = "bin"
