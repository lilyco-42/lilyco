[workspace]
members = [
    "crates/lilyco-core",
    "crates/lilyco-macros",
    "crates/lilyco-cli",
    "crates/lilyco-tui",
    "crates/lilyco-gui",
    "crates/lilyco-mcp",
    "crates/lilyco-ultra-ui",
    "crates/lilyco",
    "crates/lilyco-dev",
    "crates/lilyco-example",
    "crates/rapid-core",
    "crates/rapid-server",
    "crates/lilyco-rapid",
    "crates/lilyco-no_std",
]
resolver = "2"

[workspace.package]
version = "0.3.1"

[profile.dev]
opt-level = 1
debug = false
incremental = true
codegen-units = 16
strip = "debuginfo"
panic = "abort"

[profile.dev.package."*"]
opt-level = "z"
debug = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
overflow-checks = false
debug-assertions = false
