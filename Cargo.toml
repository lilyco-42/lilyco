[workspace]
members = [
    "lilyco-core",
    "lilyco-macros",
    "lilyco-cli",
    "lilyco-tui",
    "lilyco-gui",
    "lilyco-mcp",
    "lilyco-ultra-ui",
    "lilyco",
    "lilyco-dev",
    "lilyco-example",
]
resolver = "2"

[workspace.package]
version = "0.3.0"

[profile.dev]
opt-level = 1
debug = false
incremental = true
codegen-units = 16
strip = "debuginfo"
panic = "abort"

[profile.dev.package."*"]
opt-level = "z"
debug = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
overflow-checks = false
debug-assertions = false
