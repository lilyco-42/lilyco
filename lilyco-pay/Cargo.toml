[package]
name = "lilyco-pay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Feature-gated multi-channel payment plugin kit for Lilyco apps (Afdian / Alipay RSA2 / Stripe / Google Play / USDT)"

[features]
default = []
afdian = ["dep:md-5", "dep:ureq"]
alipay = ["dep:rsa", "dep:sha2", "dep:base64", "dep:ureq"]
stripe = ["dep:ureq"]
creem = ["dep:ureq", "dep:ring"]
google-play = []
usdt = []
full = ["afdian", "alipay", "stripe", "creem", "google-play", "usdt"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

base64 = { workspace = true, optional = true }
md-5 = { version = "0.10", optional = true }
ring = { workspace = true, optional = true }
rsa = { version = "0.9", features = ["sha2"], optional = true }
sha2 = { version = "0.10", optional = true }
ureq = { version = "3", features = ["json"], optional = true }
