[package]
name = "lilyco-tui"
version = "0.2.3"
edition = "2021"
description = "Lilyco TUI renderer — interactive terminal form with live CLI preview"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"
keywords = ["tui", "terminal", "ratatui", "form"]
categories = ["command-line-interface"]

[dependencies]
lilyco-core = { version = "0.2", path = "../lilyco-core" }
ratatui = "0.29"
crossterm = "0.28"
serde_json = "1"
