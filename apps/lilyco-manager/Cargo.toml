[package]
name = "lilyco-manager"
version = "0.1.1"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "2.0", default-features = false, features = ["sqlx-sqlite", "runtime-tokio", "macros"] }
getrandom = "0.2"

