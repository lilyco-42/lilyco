[package]
name = "tiny-agent-server"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Standalone workspace: the server pulls a network stack that the headless
# `lilyco-no_std` CI never sees.
[workspace]

[dependencies]
lilyco-no_std = { path = "../../lilyco-no_std", features = ["std", "llm-http", "llm-anthropic"] }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net"] }
tokio-stream = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
