[package]
name = "tiny-agent-gpui-client"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Standalone workspace: the windowing stack is Windows-only for our purposes and
# must never end up in the headless crate's CI.
[workspace]

[dependencies]
gpui = "0.2.2"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
