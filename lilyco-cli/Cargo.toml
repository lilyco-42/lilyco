[package]
name = "lilyco-cli"
version = "0.2.2"
edition = "2021"
description = "Lilyco CLI renderer — generates clap::Command from CommandSchema"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"
keywords = ["cli", "clap", "schema", "ai"]
categories = ["command-line-interface"]

[dependencies]
lilyco-core = { version = "0.2", path = "../lilyco-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
