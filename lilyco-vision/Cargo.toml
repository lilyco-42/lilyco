[package]
name = "lilyco-vision"
version = "0.1.0"
edition = "2021"
description = "Vision toolkit (image-info / crop / resize / dominant-colors / pixel-diff / foreground / trace / screenshot) as Lilyco apps — CLI / TUI / Web / MCP, AI-callable by default"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"

[[bin]]
name = "lvision"
path = "src/main.rs"

[dependencies]
# 可选：android 构建用 headless（--no-default-features --features android，
# 只剩 CLI + MCP，纯 Rust 可在 aarch64-linux-android 编译）
lilyco = { path = "../lilyco", optional = true, default-features = false }
# derive(App) 宏展开引用 lilyco_core::… 路径，binary 需要能解析到它
lilyco-core = { path = "../lilyco-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# 溯源 trace：vtracer 是上游 DSH Vision Toolkit 的 Python 包装所依赖的同一引擎；
# 按需求锁定 1.0.0-alpha.3（pipeline 版 API：Config::build() → Pipeline::to_svg）
vtracer = "1.0.0-alpha.3"

[features]
default = ["full"]
# 全功能（CLI + TUI + Web + MCP）
full = ["dep:lilyco", "lilyco/full"]
# Android/Termux：headless（CLI + MCP）
android = ["dep:lilyco"]

[dev-dependencies]
tempfile = "3"