[package]
name = "lilyco-core"
version = "0.2.1"
edition = "2021"
description = "Lilyco core traits and types — make Rust software AI-callable by default"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"
readme = "../README.md"
keywords = ["cli", "tui", "web", "ai", "schema"]
categories = ["command-line-interface", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[features]
default = ["cli"]
cli = []
tui = []
gui = []
