[package]
name = "lilyco-plc"
version.workspace = true
edition = "2021"
description = "Lilyco hardware bridge — zero-dep Modbus TCP client, PLC read/write AI-callable with safety tiers and telemetry"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"

[[bin]]
name = "lplc"
path = "src/main.rs"

[dependencies]
# default-features = false → headless（CLI + MCP），aarch64 伴飞计算机可编
lilyco = { path = "../lilyco", default-features = false }
serde_json = "1"
