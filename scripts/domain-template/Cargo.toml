[package]
name = "@CRATE@"
version.workspace = true
edition = "2021"
description = "@BIN@ — <这个域回答什么问题>，四端 (CLI / TUI / Web / MCP) + AI 可调"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"
keywords = ["cli", "mcp"]
categories = ["command-line-interface", "development-tools"]

[[bin]]
name = "@BIN@"
path = "src/main.rs"

[dependencies]
# 可选：android 构建用 headless（--no-default-features --features android，
# 只剩 CLI + MCP，纯 Rust 可在 aarch64-linux-android 编译）。
# 应用 crate 只依赖 facade：core 的类型走 lilyco::prelude::*，
# derive(App) 默认展开成 ::lilyco::__core::…（要绕开 facade 用 #[app(crate = "lilyco_core")]）
lilyco = { version = "0.3", path = "../lilyco", optional = true, default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["full"]
# 全功能（CLI + TUI + Web + MCP）
full = ["dep:lilyco", "lilyco/full"]
# Android/Termux：headless（CLI + MCP）
android = ["dep:lilyco"]

[dev-dependencies]
tempfile = "3"

# ── cargo binstall ────────────────────────────────────────
# 只有 crate 发布且 CI 真的产出该资产时才有效；资产命名规则见 docs/INTEGRATION.md §4
# 资产命名 `{ name }-{ target }{ binary-ext }`（完整 target triple）；
# pkg-fmt = "bin"：下载的单文件即二进制
[package.metadata.binstall]
pkg-url = "https://github.com/lilyco-42/lilyco/releases/download/v{ version }/{ name }-{ target }{ binary-ext }"
pkg-fmt = "bin"
