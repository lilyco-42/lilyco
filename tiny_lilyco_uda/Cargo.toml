[package]
name = "tiny_lilyco_uda"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "UniDesktop/SDK bridge for lilyco-no_std"
publish = false

# Standalone workspace on purpose: UDA is a git dependency, and the headless
# `lilyco-no_std` CI must never pay a network round-trip for it.
[workspace]

[dependencies]
lilyco-no_std = { path = "../lilyco-no_std", features = ["std"] }
uda-core = { git = "https://github.com/UniDesktop/SDK", tag = "v0.2.1" }

[target.'cfg(windows)'.dependencies]
uda-platform-windows = { git = "https://github.com/UniDesktop/SDK", tag = "v0.2.1" }

[target.'cfg(target_os = "linux")'.dependencies]
uda-platform-linux = { git = "https://github.com/UniDesktop/SDK", tag = "v0.2.1" }
