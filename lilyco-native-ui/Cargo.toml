[package]
name = "lilyco-native-ui"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"
publish = false
description = "同一份 UiSpec 渲染成 NSH 原生 GTK 视图：无 WebView、无 JavaScript 运行时"

[dependencies]
lilyco-ultra-ui = { path = "../lilyco-ultra-ui", version = "0.3" }
nsh-core = "0.5.1"
nsh-base = "0.5.1"
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[workspace]
