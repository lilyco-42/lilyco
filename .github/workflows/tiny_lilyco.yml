name: Tiny Lilyco Remote CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'tiny_lilyco/**'
      - 'scripts/check_nesting.py'
      - '.github/workflows/tiny_lilyco.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tiny_lilyco/**'
      - 'scripts/check_nesting.py'

env:
  CARGO_TERM_COLOR: always

# `tiny_lilyco` is a standalone workspace (its own `[workspace]` table), so every
# cargo command below runs with that directory as the working directory and must
# not use `-p`.
defaults:
  run:
    working-directory: tiny_lilyco

jobs:
  nesting-budget:
    name: Enforce nesting budget (<= 4 levels)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check nesting depth and indentation
        working-directory: .
        run: python3 scripts/check_nesting.py tiny_lilyco/src

  no-std-targets:
    name: Bare no_std (ARM Cortex-M4) and WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tiny_lilyco
          cache-all-crates: true
          cache-on-failure: true
          key: nostd
      - name: ARM Cortex-M4 check
        run: cargo check --lib --target thumbv7em-none-eabi --no-default-features
      - name: WASM check
        run: cargo check --lib --target wasm32-unknown-unknown --no-default-features

  host-quality:
    name: Clippy and tests on the host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tiny_lilyco
          cache-all-crates: true
          cache-on-failure: true
          key: host
      - name: Clippy, no_std core
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: Clippy, host bridge
        run: cargo clippy --features std --all-targets -- -D warnings
      - name: Unit tests, core only
        run: cargo test --no-default-features
      - name: Clippy, model client
        run: cargo clippy --features "std llm-http llm-anthropic" --all-targets -- -D warnings
      - name: Unit tests, model client (offline, no network)
        run: cargo test --features "std llm-http llm-anthropic"
      - name: Structural search smoke (ast-grep, not hand-written)
        run: |
          curl -sSL -o /tmp/sg.zip https://github.com/ast-grep/ast-grep/releases/latest/download/app-x86_64-unknown-linux-gnu.zip
          mkdir -p /tmp/sg && unzip -q /tmp/sg.zip -d /tmp/sg
          chmod +x /tmp/sg/ast-grep
          mkdir -p /tmp/tiny-sg
          printf 'pub fn alpha() {}\npub fn beta() {}\n' > /tmp/tiny-sg/lib.rs
          AST_GREP_BIN=/tmp/sg/ast-grep cargo run --quiet --features std --bin tiny-agent -- \
            /tmp/tiny-sg --call "ast_grep:rust|pub fn \$NAME()" | tee /tmp/sg-out.txt
          grep -q "alpha" /tmp/sg-out.txt
          grep -q "beta" /tmp/sg-out.txt

      - name: Build the wasm tool fixture
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown \
            --manifest-path tests/fixtures/wasm_tool/Cargo.toml

      - name: WASM tool smoke (external tool, not hand-written)
        run: |
          mkdir -p /tmp/tiny-wasm
          cargo run --quiet --features "std wasm-tools" --bin tiny-agent -- \
            /tmp/tiny-wasm --apply \
            --wasm-tool echo=tests/fixtures/wasm_tool/target/wasm32-unknown-unknown/release/wasm_tool_fixture.wasm \
            --call "echo:hello wasm" | tee /tmp/wasm-out.txt
          grep -q "wasm saw: hello wasm" /tmp/wasm-out.txt
          grep -q "1 calls, 0 failures" /tmp/wasm-out.txt
      - name: Write path smoke (edit + snapshot + undo)
        run: |
          mkdir -p /tmp/tiny-write
          printf 'let a = 1;\n' > /tmp/tiny-write/code.rs
          cargo run --quiet --features std --bin tiny-agent -- \
            /tmp/tiny-write --apply --call "edit_file:code.rs|a = 1|a = 2" \
            | tee /tmp/write-out.txt
          grep -q "a = 2" /tmp/tiny-write/code.rs
          test -d /tmp/tiny-write/.tiny-agent/snap
          grep -q "1 calls, 0 failures" /tmp/write-out.txt
      - name: Model client smoke (local stub, no internet)
        run: |
          cat > /tmp/stub.py <<'PY'
          import json, http.server
          calls = {"n": 0}
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  calls["n"] += 1
                  if calls["n"] == 1:
                      msg = {"tool_calls": [{"function": {"name": "read_file",
                             "arguments": json.dumps({"args": "note.txt"})}}]}
                  else:
                      msg = {"content": "done"}
                  body = json.dumps({"choices": [{"message": msg}]}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          http.server.HTTPServer(("127.0.0.1", 8799), H).serve_forever()
          PY
          python3 /tmp/stub.py &
          sleep 1
          mkdir -p /tmp/tiny-http
          printf 'alpha\nbeta\n' > /tmp/tiny-http/note.txt
          cargo run --quiet --features "std llm-http" --bin tiny-agent -- \
            /tmp/tiny-http --provider local --base-url http://127.0.0.1:8799/v1 \
            --model stub --api-key test --goal "read the note" | tee /tmp/http-out.txt
          grep -q "read_file(note.txt) -> text" /tmp/http-out.txt
          grep -q "1 calls, 0 failures" /tmp/http-out.txt
          kill %1 || true
      - name: Agent CLI smoke (real files, real loop)
        run: |
          mkdir -p /tmp/tiny-smoke
          printf 'alpha\nbeta\n' > /tmp/tiny-smoke/note.txt
          cargo run --quiet --features std --bin tiny-agent -- \
            /tmp/tiny-smoke --call list_dir: --call read_file:note.txt | tee /tmp/agent-out.txt
          grep -q "note.txt" /tmp/agent-out.txt
          grep -q "beta" /tmp/agent-out.txt
          grep -q "2 calls" /tmp/agent-out.txt
      - name: Unit tests, with host bridge
        run: cargo test --features std
