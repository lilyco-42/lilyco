name: Lilyco Tool Hub
on:
  push:
    branches: [main]
    paths:
      - 'apps/lilyco-toolhub/**'
      - '.github/workflows/lilyco-toolhub.yml'
  pull_request:
    paths:
      - 'apps/lilyco-toolhub/**'
      - '.github/workflows/lilyco-toolhub.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test toolhub MCP discovery, safety and GUI security
        run: python -m unittest discover -s apps/lilyco-toolhub/tests -v
      - uses: oven-sh/setup-bun@v2
      - name: Build commercial component library GUI
        shell: bash
        run: |
          cd apps/lilyco-toolhub/gui
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
  build-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Build packaged human GUI
        shell: bash
        run: |
          cd apps/lilyco-toolhub/gui
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
      - name: Test new Spine native metadata tools
        run: cargo test -p lilyco-spine
      - name: Build existing local MCP domain tools
        run: cargo build --release -p lilyco-vision -p lilyco-files -p lilyco-grep -p lilyco-ffmpeg -p lilyco-mpkg -p lilyco-spine
      - name: Validate local tool discovery through unified Hub
        shell: bash
        run: |
          mkdir -p _hubdist
          if [[ "${{ runner.os }}" == "Windows" ]]; then ext=".exe"; else ext=""; fi
          cp target/release/lvision$ext target/release/lfiles$ext target/release/lgrep$ext target/release/lffmpeg$ext target/release/lmpkg$ext target/release/lspine$ext _hubdist/
          cp apps/lilyco-toolhub/media_mcp.py apps/lilyco-toolhub/html_capture.mjs apps/lilyco-toolhub/package.json _hubdist/
          python apps/lilyco-toolhub/scripts/prepare_bundle.py _hubdist
          python -c "import importlib.util,json; spec=importlib.util.spec_from_file_location('hub','apps/lilyco-toolhub/hub.py'); m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m);h=m.ToolHub(json.load(open('_hubdist/tools.json')));names=[x['name'] for x in h.discover()]; print('discovered',len(names),'tools'); assert len(names)>=23 and 'vision__remove-background' in names and 'media__manim_render' in names and 'media__html_to_video' in names and 'spine__inspect-skeleton' in names and 'spine__inspect-atlas' in names; assert all(not x.startswith('unavailable') for x in h.status.values()),h.status"
      - name: Package client-side binaries and Hub
        shell: bash
        run: |
          cp apps/lilyco-toolhub/hub.py apps/lilyco-toolhub/gui_server.py apps/lilyco-toolhub/README.md apps/lilyco-toolhub/tools.example.json _hubdist/
          mkdir -p _hubdist/gui
          cp -R apps/lilyco-toolhub/gui/dist _hubdist/gui/
          cp apps/lilyco-toolhub/gui/NAIVE_UI_LICENSE.txt apps/lilyco-toolhub/gui/THIRD_PARTY_NOTICES.md _hubdist/gui/
          cp -R apps/lilyco-toolhub/docs _hubdist/docs/
          cp apps/lilyco-toolhub/scripts/prepare_bundle.py _hubdist/
          rm _hubdist/tools.json
      - uses: actions/upload-artifact@v4
        with:
          name: lilyco-toolhub-${{ runner.os }}
          path: _hubdist/
          if-no-files-found: error
