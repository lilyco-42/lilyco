name: Lilyco Manager Release

# 只发布管理器自身的资产：标签用 `manager-v*`，不会命中 ci.yml 里
# `refs/tags/v*` 的应用发布 job。
on:
  push:
    tags: ['manager-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 发布标签（形如 manager-v0.2.0）
        required: true

permissions:
  contents: write

concurrency:
  group: lilyco-manager-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            asset: lilyco-manager-linux-x64.tar.gz
          - os: windows-latest
            platform: windows-x64
            asset: lilyco-manager-windows-x64.zip
          - os: macos-latest
            platform: macos-universal
            asset: lilyco-manager-macos-universal.tar.gz
    defaults:
      run:
        working-directory: apps/lilyco-manager
    steps:
      - uses: actions/checkout@v4

      - name: Checkout reviewed WASM pixel kernels source
        uses: actions/checkout@v4
        with:
          repository: lilyco-42/wasm-pixel-kernels
          ref: 94285d78cec5edb0e2f671b0bfe5632a4d05df10
          path: external-wasm-pixel-kernels

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/lilyco-manager

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build reviewed browser WASM
        shell: bash
        run: |
          printf "\n[workspace]\n" >> ../../external-wasm-pixel-kernels/Cargo.toml
          cargo build --release --target wasm32-unknown-unknown --manifest-path ../../external-wasm-pixel-kernels/Cargo.toml
          bun scripts/embed-wasm.mjs ../../external-wasm-pixel-kernels/target/wasm32-unknown-unknown/release/wasm_pixel_kernels.wasm

      - name: Build Vue UI
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run typecheck
          bun run build

      - name: Build binary (Linux / Windows)
        if: runner.os != 'macOS'
        run: cargo build --release

      # macOS 发布 universal 二进制：两个架构分别编译后 lipo 合并。
      - name: Build binary (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p universal
          lipo -create -output universal/lilyco-manager \
            target/aarch64-apple-darwin/release/lilyco-manager \
            target/x86_64-apple-darwin/release/lilyco-manager
          lipo -archs universal/lilyco-manager

      - name: Package asset (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/lilyco-manager dist/
          tar -czf "${{ matrix.asset }}" -C dist lilyco-manager
          ls -l "${{ matrix.asset }}"

      - name: Package asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/lilyco-manager.exe dist/
          Compress-Archive -Path dist/lilyco-manager.exe -DestinationPath "${{ matrix.asset }}" -Force
          Get-Item "${{ matrix.asset }}" | Format-List Name,Length

      - name: Package asset (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp universal/lilyco-manager dist/
          tar -czf "${{ matrix.asset }}" -C dist lilyco-manager
          ls -l "${{ matrix.asset }}"

      - name: Write SHA-256
        shell: bash
        run: |
          mkdir -p checksums
          if [ "${{ runner.os }}" = "macOS" ]; then
            shasum -a 256 "${{ matrix.asset }}" | awk '{print $1"  "$2}' > "checksums/${{ matrix.asset }}.sha256"
          else
            sha256sum "${{ matrix.asset }}" > "checksums/${{ matrix.asset }}.sha256"
          fi
          cat "checksums/${{ matrix.asset }}.sha256"

      # 从压缩包解出来真跑一次。管理器没有 --help，启动后打印监听地址再由 timeout 收掉，
      # 这样才能证明资产本身可执行，而不是只看过编译产物。
      # GNU `timeout` 在 macOS runner 上不存在，用「后台启动 + 轮询日志 + 主动 kill」
      # 实现同样语义，Linux/macOS 共用。
      - name: Verify packaged binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p verify && cd verify
          tar -xzf "../${{ matrix.asset }}"
          LILYCO_MANAGER_NO_BROWSER=1 LILYCO_MANAGER_DB=runs.sqlite ./lilyco-manager > out.txt 2>&1 &
          pid=$!
          for _ in $(seq 1 40); do
            grep -q "listening on http://127.0.0.1:" out.txt && break
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat out.txt
          grep -q "listening on http://127.0.0.1:" out.txt

      - name: Verify packaged binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path "${{ matrix.asset }}" -DestinationPath verify -Force
          $env:LILYCO_MANAGER_NO_BROWSER = '1'
          $env:LILYCO_MANAGER_DB = 'verify\runs.sqlite'
          $p = Start-Process -FilePath ".\verify\lilyco-manager.exe" -WorkingDirectory verify `
            -RedirectStandardOutput "verify\out.txt" -RedirectStandardError "verify\err.txt" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Get-Content verify\out.txt, verify\err.txt; exit 1 }
          Stop-Process -Id $p.Id -Force
          Get-Content verify\out.txt
          Select-String -Path verify\out.txt -Pattern "listening on http://127.0.0.1:"

      - uses: actions/upload-artifact@v4
        with:
          name: manager-${{ matrix.platform }}
          path: |
            apps/lilyco-manager/${{ matrix.asset }}
            apps/lilyco-manager/checksums/${{ matrix.asset }}.sha256
          if-no-files-found: error

  release:
    name: publish manager release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: manager-*
          merge-multiple: true

      - name: Collect SHA-256 sums
        run: |
          cd release
          ls -l
          cat *.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          管理器三平台资产，均由本仓库 workflow 在对应平台构建并解包自检。

          - `linux-x64` / `windows-x64` / `macos-universal`
          - `SHA256SUMS` 与 GitHub API 返回的资产 `digest` 一致，安装端据此校验
          - 安装：解包后把二进制放进 PATH，或按 `lilyco.app.json` 的 `release` 配置由管理器托管安装
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" \
            --title "Lilyco Manager $TAG" --notes-file notes.md
          gh release upload "$TAG" release/lilyco-manager-* release/SHA256SUMS --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | [.name, .digest, .size] | @tsv'

      - name: Verify published digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[].name' > assets.txt
          cat assets.txt
          for name in lilyco-manager-linux-x64.tar.gz lilyco-manager-windows-x64.zip lilyco-manager-macos-universal.tar.gz; do
            grep -qx "$name" assets.txt || { echo "缺少资产: $name"; exit 1; }
          done
          # 每个可执行资产都必须带 sha256 digest，安装端才能校验。
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[] | select(.name | startswith("lilyco-manager-")) | .name + " " + (.digest // "MISSING")' \
            > digests.txt
          cat digests.txt
          grep -q "sha256:" digests.txt
          if grep -q "MISSING" digests.txt; then echo "资产缺少 digest"; exit 1; fi
