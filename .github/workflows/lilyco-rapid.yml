name: Lilyco Rapid

on:
  push:
    paths:
      - 'lilyco-rapid/**'
      - 'lilyco-no_std/**'
      - '.github/workflows/lilyco-rapid.yml'
  pull_request:
    paths:
      - 'lilyco-rapid/**'
      - 'lilyco-no_std/**'
      - '.github/workflows/lilyco-rapid.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            lilyco-rapid
            lilyco-rapid/ops/cli
      - name: Format API and core
        working-directory: lilyco-rapid
        run: cargo fmt --all -- --check
      - name: Lint API and core
        working-directory: lilyco-rapid
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test API and core
        working-directory: lilyco-rapid
        run: cargo test --locked --workspace
      - name: Format CLI
        working-directory: lilyco-rapid/ops/cli
        run: cargo fmt -- --check
      - name: Lint CLI
        working-directory: lilyco-rapid/ops/cli
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test CLI
        working-directory: lilyco-rapid/ops/cli
        run: cargo test --locked

  database-adapters:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: rapid
          POSTGRES_PASSWORD: rapid_ci_only
          POSTGRES_DB: rapid
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U rapid -d rapid"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rapid_ci_root_only
          MYSQL_USER: rapid
          MYSQL_PASSWORD: rapid_ci_only
          MYSQL_DATABASE: rapid
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 3s --health-timeout 4s --health-retries 30
      turso:
        image: ghcr.io/tursodatabase/libsql-server:v0.24.32
        ports:
          - 8080/tcp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lilyco-rapid
      - working-directory: lilyco-rapid
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - working-directory: lilyco-rapid
        env:
          RAPID_TEST_POSTGRES_URL: postgres://rapid:rapid_ci_only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/rapid
          RAPID_TEST_MYSQL_URL: mysql://rapid:rapid_ci_only@127.0.0.1:${{ job.services.mysql.ports[3306] }}/rapid?ssl-mode=required
          RAPID_TEST_TURSO_URL: http://127.0.0.1:${{ job.services.turso.ports[8080] }}
        run: |
          curl --retry 20 --retry-delay 1 --retry-all-errors -fsS "$RAPID_TEST_TURSO_URL/health"
          cargo test --locked --workspace --all-features -- --include-ignored

  portable-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabi, riscv32imac-unknown-none-elf, wasm32-unknown-unknown, aarch64-linux-android, aarch64-unknown-linux-ohos]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - working-directory: lilyco-rapid
        run: cargo check --locked -p rapid-core --no-default-features --target ${{ matrix.target }}
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - working-directory: lilyco-rapid
        run: cargo check --locked -p rapid-core --no-default-features --target aarch64-apple-ios

  generated-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Scaffold an application without repository dependencies
        shell: bash
        run: |
          cargo install --locked --path lilyco-rapid/ops/cli --root "$RUNNER_TEMP/rapid-tools"
          echo "$RUNNER_TEMP/rapid-tools/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/rapid-tools/bin/lilyco-rapid" new release-smoke --dir "$RUNNER_TEMP"
      - name: Build and run the generated Compose stack
        shell: bash
        env:
          RAPID_PORT: 18421
        run: |
          cd "$RUNNER_TEMP/release-smoke"
          lilyco-rapid generate resource notes --field title:string --field priority:i32
          docker compose up --build -d
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18421/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18421/readyz
          curl -fsS http://127.0.0.1:18421/ >/tmp/rapid-index.html
          grep -q 'Lilyco Rapid' /tmp/rapid-index.html
          curl -fsS -H 'Content-Type: application/json' -d '{"title":"deployment check","priority":2}' \
            http://127.0.0.1:18421/api/notes | grep -q 'deployment check'
          docker compose restart api
          curl --retry 15 --retry-delay 1 --retry-all-errors -fsS http://127.0.0.1:18421/api/notes \
            | grep -q 'deployment check'
      - if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/release-smoke/compose.yaml"; then
            cd "$RUNNER_TEMP/release-smoke"
            docker compose logs
            docker compose down -v
          fi
