name: Desktop (Tauri)

# 桌面端只在相关文件变化时跑：它要编三个平台，比那批 office 对账便宜不了多少。
# 产物一律由 CI 交（本机不编）：每次 run 都上传 .msi / .dmg / .AppImage 作为 run 工件，
# 打了 v* 标签时才顺手挂到 GitHub Release 上。
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "lilyco-tauri/**"
      - "lilyco-binfmt/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "lilyco-tauri/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: bundle (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
          - os: ubuntu-22.04
            label: linux
    steps:
      - uses: actions/checkout@v4

      - name: 系统依赖（Linux 上的 webkit2gtk 那一套）
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            patchelf libssl-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # sidecar 得先有：桌面端不自己再造一个读者，它跑的就是 CI 上那本对账认的 lbin
      - name: 编 lbin（随包带出来的 sidecar）
        run: cargo build --release -p lilyco-binfmt --bin lbin

      - name: 把 lbin 放到 tauri 认的位置（带 target triple 后缀）
        shell: bash
        run: |
          set -euo pipefail
          TRIPLE=$(rustc -vV | sed -n 's|host: ||p')
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          mkdir -p lilyco-tauri/binaries
          cp "target/release/lbin${EXT}" "lilyco-tauri/binaries/lbin-${TRIPLE}${EXT}"
          ls -l lilyco-tauri/binaries

      # 没配 Apple 证书 / notary 凭据时这一段就是未签名未公证：CI 照样成功，
      # 但 macOS 那份在别人机器上会被 Gatekeeper 拦 —— 不说成「可直接安装」
      #
      # 两条从上一版日志里读出来的坑，都不是我们这边的代码：
      # 1) includeRelease 必须是 true。tauri-action 只在 includeRelease 或 includeDebug
      #    为真时才真的跑 `tauri build`；两个都 false 时它一个文件都不碰，然后打一句
      #    「No artifacts were found. The action was not configured to upload artifacts」
      #    并以 success 收工 —— 上一次三条流水线各红了 100 毫秒，就是这个。
      #    传 true 不等于发版：只有 tagName / releaseId 有值它才碰 release（源码里
      #    「No releaseId or tagName provided, skipping all uploads...」那条分支），
      #    分支推送两个都空，所以只是「编 + 打 bundle」，上传工件仍由下面一步自己做。
      # 2) tauriScript 必须显式给。本仓库前端零 npm 依赖（没有 package.json），而 action
      #    找不到 @tauri-apps/cli 依赖时会退回 `npm i -g @tauri-apps/cli@v1` —— v1 的 CLI
      #    读不了 v2 配置。这里直接点明用 v2。
      # ── Apple 那套凭据：有证书才交，没有就连变量都不存在 ───────────────────
      # 上一版三条流水线里 Linux 与 Windows 已经绿过（bundle 收得到），macOS 红在打包这一步：
      #   Bundling lilyco office.app → security: SecKeychainItemImport: One or more
      #   parameters passed to a function were not valid → failed to import keychain certificate
      # 根因不在我们这边：GitHub 对没配的 secret 交出来的是**空串**，而不是「没有这个变量」，
      # 而 tauri CLI 判「要不要签名」只看 APPLE_CERTIFICATE 存不存在 —— 空串也算存在，
      # 于是它拿一张不存在的证书去 import。所以这一步把凭据按原样搬进 $GITHUB_ENV，
      # 而且只在真有证书时才搬；没有时那个变量压根不出现，CLI 就走未签名那条路（CI 照样绿，
      # 但别人下载后会被 Gatekeeper 拦住 —— 这一点在 readme 里明说，不替凭据的存在说谎）。
      - name: 有 Apple 证书才交给签名那条路
        if: matrix.label == 'macos' && secrets.APPLE_CERTIFICATE != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          {
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: tauri build + bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: lilyco-tauri
          # 见上面第 2 条：前端零 npm 依赖，所以 CLI 由 npx 现取，版本与 Cargo 那边的 tauri = "2" 同族
          tauriScript: npx --yes @tauri-apps/cli@2
          includeRelease: true
          # 只有 v* 标签才给 tagName —— 那时才把 bundle 挂到对应 release 上；
          # 分支推送留空，action 就走「skipping all uploads」那条分支，只编不改发布
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      # bundle 到底落在哪由 find 说，不靠猜：workspace 成员可能出在 target/release/bundle，
      # 也可能出在 target/<triple>/release/bundle，收齐后平铺进 dist/。
      # 空手而归时明着红（并把 target 下所有 bundle 目录打出来），而不是静默交一个空工件
      - name: 收工件（bundle 目录在哪由 find 说）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find . -path ./.git -prune -o -type f -print \
            | grep -E '/bundle/.*\.(dmg|msi|exe|deb|rpm|AppImage|zsync|sig)$' \
            > /tmp/bundles.txt || true
          if [ ! -s /tmp/bundles.txt ]; then
            echo "::error::tauri build 没产出任何 bundle 文件"
            find . -path ./.git -prune -o -type d -name bundle -print || true
            exit 1
          fi
          while IFS= read -r f; do cp "$f" dist/; done < /tmp/bundles.txt
          echo "=== 收到的工件 ==="
          ls -l dist

      - name: 交工件（每次 run 都留一份能直接下载的）
        uses: actions/upload-artifact@v4
        with:
          name: lilyco-office-${{ matrix.label }}
          if-no-files-found: error
          path: dist
