name: Asset Studio
on:
  pull_request:
    paths: ['apps/asset-studio/**', 'lilyco-aic/**', '.github/workflows/asset-studio.yml']
  push:
    branches: [main]
    paths: ['apps/asset-studio/**', 'lilyco-aic/**', '.github/workflows/asset-studio.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: asset-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Existing desktop and software GPU prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libssl-dev libxdo-dev libegl1 libgl1-mesa-dri mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
        with:
          key: vision-workspace-contract
          cache-on-failure: true
      - name: Real existing Tauri sidecar
        shell: bash
        run: |
          cargo build --locked -p lilyco-binfmt --bin lbin
          TRIPLE=$(rustc -vV | sed -n 's|host: ||p')
          mkdir -p lilyco-tauri/binaries
          cp target/debug/lbin "lilyco-tauri/binaries/lbin-${TRIPLE}"
      - name: AGENTS workspace gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets
          cargo test --locked --workspace

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: asset-studio-headless
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the actual shadcn workspace
        working-directory: apps/asset-studio/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build and test original AIC engine (headless)
        run: |
          cargo test -p lilyco-aic --no-default-features --features android
          cargo build --release -p lilyco-aic --no-default-features --features android
      - name: Install app and verification dependencies
        run: python -m pip install -r apps/asset-studio/requirements.txt httpx==0.28.1 pillow==11.3.0 pyinstaller==6.16.0
      - name: Bundle the trusted engine
        shell: bash
        run: |
          mkdir -p apps/asset-studio/bin
          EXT=""; if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          cp "target/release/laic${EXT}" "apps/asset-studio/bin/laic${EXT}"
      - name: Real API, export, cancellation and local boundary tests
        working-directory: apps/asset-studio
        run: python -m unittest discover -s tests -v
        env:
          LAIN42_LAIC: ${{ github.workspace }}/apps/asset-studio/bin/laic${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Desktop and phone-size browser acceptance
        if: runner.os == 'Linux'
        working-directory: apps/asset-studio
        shell: bash
        run: |
          python tests/fixture.py tests/demo.pxls
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python -m uvicorn 'studio.app:create_app' --factory --host 127.0.0.1 --port 8043 > /tmp/asset-studio-ui.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8043/ >/dev/null && break || sleep .25; done
          node tests/ui.mjs
      - name: Package complete double-click app
        working-directory: apps/asset-studio
        run: python packaging/build-app.py
      - name: Collect dependency attribution
        working-directory: apps/asset-studio
        run: python tests/notices.py
      - name: Verify complete package with bundled engine
        working-directory: apps/asset-studio
        run: python tests/bundle_smoke.py dist/Lain42-Asset-Studio/Lain42-Asset-Studio${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Add license, instructions and SHA manifest; archive
        working-directory: apps/asset-studio
        shell: bash
        run: |
          cp ../../LICENSE README.md THIRD-PARTY-NOTICES.json dist/Lain42-Asset-Studio/
          cp ui/package-lock.json dist/Lain42-Asset-Studio/UI-package-lock.json
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp MICROSOFT-WEBVIEW2-LICENSE.txt dist/Lain42-Asset-Studio/
            cp packaging/webview2-sdk.json dist/Lain42-Asset-Studio/webview2-sdk.json
          fi
          python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path('dist/Lain42-Asset-Studio')
          manifest={'commit':os.environ['GITHUB_SHA'],'runner':os.environ['RUNNER_OS'],'contains_spine_runtime':False,'files':{str(p.relative_to(root).as_posix()):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          target=pathlib.Path('dist')/('lain42-asset-studio-'+os.environ['RUNNER_OS'].lower()+'.zip')
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as archive:
              for p in root.rglob('*'):
                  if p.is_file(): archive.write(p,p.relative_to(root.parent).as_posix())
          target.with_suffix('.zip.sha256').write_text(hashlib.sha256(target.read_bytes()).hexdigest()+'\n',encoding='ascii')
          PY
      - name: Prepare Windows native acceptance and installer tools
        if: runner.os == 'Windows'
        working-directory: apps/asset-studio
        shell: pwsh
        run: |
          npm install --no-save playwright@1.56.1
          python tests/fixture.py tests/demo.pxls
          choco install nsis -y --no-progress
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile webview2-bootstrap.exe
          $signature = Get-AuthenticodeSignature webview2-bootstrap.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid WebView2 bootstrap signature' }
          $setup = Start-Process ./webview2-bootstrap.exe -ArgumentList '/silent','/install' -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -notin 0,3010) { throw "WebView2 install failed: $($setup.ExitCode)" }
      - name: Verify real packaged WebView2, export and normal close
        if: runner.os == 'Windows'
        working-directory: apps/asset-studio
        run: node tests/desktop_smoke.mjs dist/Lain42-Asset-Studio/Lain42-Asset-Studio.exe
      - name: Build and exercise the Windows installation EXE
        if: runner.os == 'Windows'
        working-directory: apps/asset-studio
        run: |
          python packaging/windows-installer.py
          python tests/installer_smoke.py
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asset-studio-failure-${{ runner.os }}-${{ github.sha }}
          path: apps/asset-studio/evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: lain42-asset-studio-${{ runner.os }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            apps/asset-studio/dist/*.zip
            apps/asset-studio/dist/*.sha256
            apps/asset-studio/dist/*-setup.exe
            apps/asset-studio/ui/package-lock.json
            apps/asset-studio/evidence/*
