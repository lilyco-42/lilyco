name: Lilyco Manager CI
on:
  push:
    branches: [main]
    paths:
      - 'apps/lilyco-manager/**'
      - '.github/workflows/lilyco-manager.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/lilyco-manager
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Validate project catalog
        run: bun scripts/validate-catalog.mjs
      - name: Build Vue UI
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
      - name: Browser image export smoke test
        run: |
          cd frontend
          bun run smoke
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: lilyco-manager-${{ runner.os }}
          path: apps/lilyco-manager/target/release/lilyco-manager*
          if-no-files-found: error

