name: Lilyco Manager CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/lilyco-manager/**'
      - '.github/workflows/lilyco-manager.yml'
  pull_request:
    paths:
      - 'apps/lilyco-manager/**'
      - '.github/workflows/lilyco-manager.yml'
  workflow_dispatch:
  # 线上发布源联调每周跑一次：GitHub 网络/资产命名变化才会暴露的问题。
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/lilyco-manager
    steps:
      - uses: actions/checkout@v4

      - name: Checkout reviewed WASM pixel kernels source
        uses: actions/checkout@v4
        with:
          repository: lilyco-42/wasm-pixel-kernels
          ref: 94285d78cec5edb0e2f671b0bfe5632a4d05df10
          path: external-wasm-pixel-kernels

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/lilyco-manager

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build reviewed browser WASM locally in CI only
        shell: bash
        run: |
          printf "\n[workspace]\n" >> ../../external-wasm-pixel-kernels/Cargo.toml
          cargo build --release --target wasm32-unknown-unknown --manifest-path ../../external-wasm-pixel-kernels/Cargo.toml
          bun scripts/embed-wasm.mjs ../../external-wasm-pixel-kernels/target/wasm32-unknown-unknown/release/wasm_pixel_kernels.wasm

      - name: Validate project catalog
        run: bun scripts/validate-catalog.mjs

      - name: Repository consistency
        run: bun scripts/dev-check.mjs

      - name: Build Vue UI
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run typecheck
          bun run build

      - name: Browser smoke tests
        if: runner.os == 'Linux'
        run: |
          cd frontend
          bun run smoke

      - name: Rust formatting
        run: cargo fmt -- --check

      - name: Rust lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Release build
        run: cargo build --release

      # 真实二进制 + 浏览器：确认 UI 打的是真后端（工具执行、历史、积木页）。
      - name: Browser full-stack lifecycle (real backend)
        if: runner.os == 'Linux'
        env:
          LILYCO_MANAGER_E2E_BIN: ${{ github.workspace }}/apps/lilyco-manager/target/release/lilyco-manager
        run: |
          cd frontend
          bun x playwright test tests/fullstack.spec.ts

      - name: Runtime smoke and latency
        run: bun scripts/smoke-server.mjs

      - name: Performance budgets
        run: bun scripts/perf-check.mjs

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: lilyco-manager-${{ runner.os }}
          path: apps/lilyco-manager/target/release/lilyco-manager*
          if-no-files-found: error

  # 线上发布源联调：真实 GitHub Release → SHA-256 校验 → 解包 → 执行 --version → 卸载。
  # 只在 workflow_dispatch / 每周定时跑，PR 与 main 的常规流水线不受外部网络抖动影响。
  live-release:
    name: live release (real GitHub)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/lilyco-manager
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/lilyco-manager

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Vue UI
        working-directory: apps/lilyco-manager/frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install from real GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo test -- --ignored live_
