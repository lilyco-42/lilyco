name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain (fmt + clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all targets)
        run: cargo clippy --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

      - name: Verify docs build
        run: cargo doc --workspace --no-deps

  # 产出可直接使用的 lbrush.exe —— 本机不装 Rust 也能拿到二进制
  release-build:
    name: build lbrush (windows)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build lbrush (release)
        run: cargo build --release -p lilyco-brush

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lbrush-windows
          path: target/release/lbrush.exe
          if-no-files-found: error

  # Android（Termux）：headless 构建（CLI + MCP，纯 Rust）
  # crossterm 的 cfg(unix) 不含 android，TUI/Web 后端在 android 目标上关闭
  android:
    name: build android (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3
        with:
          ndk-version: "27.2.12479018"

      - name: Install android target
        run: rustup target add aarch64-linux-android

      - name: Build lbrush (android headless: CLI+MCP)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"
          cargo build --release -p lilyco-brush \
            --no-default-features --features android \
            --target aarch64-linux-android

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lbrush-android-arm64
          path: target/aarch64-linux-android/release/lbrush
          if-no-files-found: error
