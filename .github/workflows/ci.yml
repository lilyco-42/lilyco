name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: hygiene (架构守则)
    uses: lilyco-42/.github/.github/workflows/lyco-hygiene.yml@main

  framework:
    name: framework (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain (fmt + clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets

      - name: Run tests (workspace)
        run: cargo test --workspace

      - name: "Run tests (facade full features: tui + web + ultra)"
        run: cargo test -p lilyco --features full

      - name: Verify docs build
        run: cargo doc --workspace --no-deps

  android:
    name: build android (aarch64 headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018'
      - name: Install android target
        run: rustup target add aarch64-linux-android
      - name: Check headless SDK (CLI + MCP) for Android aarch64
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"
          cargo check -p lilyco-core -p lilyco-cli -p lilyco-mcp -p lilyco --no-default-features --target aarch64-linux-android

  companion:
    name: companion (aarch64 musl headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain + aarch64 musl target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-musl
      - name: Install aarch64 cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build headless SDK (CLI + MCP) for aarch64 musl
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build -p lilyco -p lilyco-core -p lilyco-cli -p lilyco-mcp \
            --target aarch64-unknown-linux-musl --no-default-features --release
