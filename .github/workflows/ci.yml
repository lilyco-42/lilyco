name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 组织级架构守则（git 依赖锁 rev / 大文件不入库）—— reusable workflow
  hygiene:
    name: hygiene (架构守则)
    uses: lilyco-42/.github/.github/workflows/lyco-hygiene.yml@main

  # 框架 crate：core/macros/cli/tui/gui/mcp/ultra-ui/facade
  # 与应用 job 拆分 —— 应用挂了不拖累框架绿（守则：框架 CI 不被应用 C 依赖卡住）
  framework:
    name: framework (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # P1 出图：ubuntu CI 无独显，装 Mesa 软件 GPU 栈（lavapipe Vulkan / llvmpipe GL）
      # 让 graphite-export-png 的 GPU 探测能通过并真实执行；装不上也不影响 SVG 主路径
      - name: Install Mesa software GPU (PNG export best-effort)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri mesa-vulkan-drivers

      - name: Install stable toolchain (fmt + clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Clippy (framework, all targets)
        run: cargo clippy -p lilyco-core -p lilyco-macros -p lilyco-cli -p lilyco-tui -p lilyco-gui -p lilyco-mcp -p lilyco-ultra-ui -p lilyco --all-targets

      - name: Run tests (framework, headless)
        run: cargo test -p lilyco-core -p lilyco-macros -p lilyco-cli -p lilyco-tui -p lilyco-gui -p lilyco-mcp -p lilyco-ultra-ui -p lilyco

      - name: "Run tests (facade full features: tui + web + ultra)"
        run: cargo test -p lilyco --features full

      - name: Verify docs build (framework)
        run: cargo doc -p lilyco-core -p lilyco-macros -p lilyco-cli -p lilyco-tui -p lilyco-gui -p lilyco-mcp -p lilyco-ultra-ui -p lilyco --no-deps

  # 应用 crate：框架消费者。ubuntu 单平台快验（windows 应用产物走 release-build）
  apps:
    name: apps (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain (fmt + clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting (workspace)
        run: cargo fmt --all -- --check

      - name: Clippy (apps, all targets)
        run: cargo clippy -p lilyco-example -p lilyco-grep -p lilyco-files -p lilyco-plc -p lilyco-brush -p lilyco-ffmpeg -p lilyco-vision -p lilyco-graphite -p lilyco-mpkg -p lilyco-pet -p lilyco-bitnet -p lilyco-letsgal -p lilyco-binfmt -p lilyco-dev --all-targets

      - name: Run tests (apps)
        run: cargo test -p lilyco-example -p lilyco-grep -p lilyco-files -p lilyco-plc -p lilyco-brush -p lilyco-ffmpeg -p lilyco-vision -p lilyco-graphite -p lilyco-mpkg -p lilyco-pet -p lilyco-bitnet -p lilyco-letsgal -p lilyco-binfmt -p lilyco-dev

      # 办公文件这一摊的证据制度：同一批字节，两套独立实现必须给出同样的答案。
      # 编译只在这里发生（本机不跑 cargo build），fixture 是提交进来的真实生产者文件，
      # 第二读者只用 Python 标准库，不装任何第三方包。
      - name: Build lbin (for the office two-reader cross-check)
        run: cargo build -p lilyco-binfmt

      - name: Office cross-check — Rust 读者 vs 标准库 Python 读者
        run: python3 scripts/acceptance/office_probe.py target/debug/lbin

  # 产出可直接使用的二进制 —— 本机不装 Rust 也能拿到
  release-build:
    name: build binaries (windows)
    runs-on: windows-latest
    needs: [framework, apps]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build lbrush (release)
        run: cargo build --release -p lilyco-brush

      - name: Upload lbrush artifact
        uses: actions/upload-artifact@v4
        with:
          name: lbrush-windows
          path: target/release/lbrush.exe
          if-no-files-found: error

      - name: Build lvision (release)
        run: cargo build --release -p lilyco-vision

      - name: Upload lvision artifact
        uses: actions/upload-artifact@v4
        with:
          name: lvision-windows
          path: target/release/lvision.exe
          if-no-files-found: error

      - name: Build lffmpeg (release)
        run: cargo build --release -p lilyco-ffmpeg

      - name: Upload lffmpeg artifact
        uses: actions/upload-artifact@v4
        with:
          name: lffmpeg-windows
          path: target/release/lffmpeg.exe
          if-no-files-found: error

  # Android（Termux）：headless 构建（CLI + MCP，纯 Rust）
  # crossterm 的 cfg(unix) 不含 android，TUI/Web 后端在 android 目标上关闭
  android:
    name: build android (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018'

      - name: Install android target
        run: rustup target add aarch64-linux-android

      - name: "Build lbrush (android headless: CLI+MCP)"
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"
          cargo build --release -p lilyco-brush \
            --no-default-features --features android \
            --target aarch64-linux-android

      - name: Upload lbrush artifact
        uses: actions/upload-artifact@v4
        with:
          name: lbrush-android-arm64
          path: target/aarch64-linux-android/release/lbrush
          if-no-files-found: error

      - name: "Build lvision (android headless: CLI+MCP)"
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"
          cargo build --release -p lilyco-vision \
            --no-default-features --features android \
            --target aarch64-linux-android

      - name: Upload lvision artifact
        uses: actions/upload-artifact@v4
        with:
          name: lvision-android-arm64
          path: target/aarch64-linux-android/release/lvision
          if-no-files-found: error

      - name: "Build lffmpeg (android headless: CLI+MCP)"
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"
          cargo build --release -p lilyco-ffmpeg \
            --no-default-features --features android \
            --target aarch64-linux-android

      - name: Upload lffmpeg artifact
        uses: actions/upload-artifact@v4
        with:
          name: lffmpeg-android-arm64
          path: target/aarch64-linux-android/release/lffmpeg
          if-no-files-found: error

  # P3 伴飞计算机（Radxa Cubie A7A / Allwinner A733 等 aarch64 Linux 板）：
  # headless 构建（CLI + MCP + PLC），aarch64-unknown-linux-musl 静态单文件，
  # scp 到板上即可跑（与 cache-node 的 musl 静态单文件先例同一路数）。
  # 独立并行 job，不挂 needs，不影响 PR 主路径（test）。
  companion:
    name: companion (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain + aarch64 musl target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-musl

      # aarch64 交叉链接器：rustc 给 musl 目标的链接命令传 AArch64 专用旗标
      # （--fix-cortex-a53-843419），宿主 x86_64 的 ld 不认识，必须换 aarch64 ld。
      # 纯 Rust 下该 gcc 只当链接驱动用——CRT/libc 全部来自 rustc 自带的 musl 自包含文件，
      # 产物仍是静态 musl 单文件（不是 glibc 动态链接）
      - name: Install aarch64 cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: "Build headless (CLI + MCP + PLC) for aarch64 musl"
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build -p lilyco -p lilyco-core -p lilyco-cli -p lilyco-mcp -p lilyco-plc \
            --target aarch64-unknown-linux-musl --no-default-features --release

      - name: Upload lplc artifact
        uses: actions/upload-artifact@v4
        with:
          name: lplc-aarch64-linux-musl
          path: target/aarch64-unknown-linux-musl/release/lplc
          if-no-files-found: error

  # 打 tag（v*）时：把 windows + android 二进制发布为 GitHub Release
  release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create 需要（仓库默认工作流权限可能是只读）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lbrush-windows
          path: release/lbrush-windows
      - uses: actions/download-artifact@v4
        with:
          name: lvision-windows
          path: release/lvision-windows
      - uses: actions/download-artifact@v4
        with:
          name: lffmpeg-windows
          path: release/lffmpeg-windows
      - uses: actions/download-artifact@v4
        with:
          name: lbrush-android-arm64
          path: release/lbrush-android-arm64
      - uses: actions/download-artifact@v4
        with:
          name: lvision-android-arm64
          path: release/lvision-android-arm64
      - uses: actions/download-artifact@v4
        with:
          name: lffmpeg-android-arm64
          path: release/lffmpeg-android-arm64

      - name: Stage release files (platform-suffixed names)
        run: |
          mkdir -p staging
          cp release/lbrush-windows/lbrush.exe staging/lbrush-windows.exe
          cp release/lvision-windows/lvision.exe staging/lvision-windows.exe
          cp release/lbrush-android-arm64/lbrush staging/lbrush-android-arm64
          cp release/lvision-android-arm64/lvision staging/lvision-android-arm64
          # lffmpeg 用完整 target triple 命名，供 cargo binstall 匹配 { target }
          cp release/lffmpeg-windows/lffmpeg.exe staging/lffmpeg-x86_64-pc-windows-msvc.exe
          cp release/lffmpeg-android-arm64/lffmpeg staging/lffmpeg-aarch64-linux-android

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            staging/lbrush-windows.exe \
            staging/lvision-windows.exe \
            staging/lbrush-android-arm64 \
            staging/lvision-android-arm64 \
            staging/lffmpeg-x86_64-pc-windows-msvc.exe \
            staging/lffmpeg-aarch64-linux-android \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
