[package]
name = "lilyco-mpkg"
version.workspace = true
edition = "2021"
description = "Lilyco memory package — mpkg content-addressed put/get/verify, T2 token-gated write with telemetry"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"

[[bin]]
name = "lmpkg"
path = "src/main.rs"

[dependencies]
# default-features = false → headless（CLI + MCP），aarch64 伴飞计算机可编
lilyco = { path = "../lilyco", default-features = false }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
