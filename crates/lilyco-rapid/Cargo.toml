[package]
name = "lilyco-rapid"
version = "0.1.10"
edition = "2024"
license = "MIT"
description = "Generate and run typed Lilyco web applications"
repository = "https://github.com/Lyco-team/lilyco"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
ctrlc = "3.4"
dotenvy = "0.15"
getrandom = "0.4"
hex = "0.4"
include_dir = "0.7"
notify = "8.2"
tempfile = "3"
