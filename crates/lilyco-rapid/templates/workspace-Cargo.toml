[workspace]
members = ["core", "server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
rapid-core = "0.1.0"
rapid-server = "0.1.6"
axum = "0.8"
schemars = { version = "1.2", default-features = false, features = ["derive"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"

[profile.release]
strip = true
lto = "thin"