[package]
name = "app-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
http-store = ["rapid-server/http-store"]
mongodb = ["rapid-server/mongodb"]
seaorm = ["rapid-server/seaorm"]
sqlx-server = ["rapid-server/sqlx-server"]
surrealdb = ["rapid-server/surrealdb"]
turso = ["rapid-server/turso"]

[dependencies]
app-core = { path = "../core" }
rapid-core = { workspace = true }
rapid-server = { workspace = true }
axum = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
schemars.workspace = true
serde.workspace = true
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"