[package]
name = "rapid-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[features]
schema = ["dep:schemars"]

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
lilyco-no_std = { path = "../lilyco-no_std", default-features = false }
schemars = { version = "1.2", default-features = false, features = ["derive"], optional = true }
