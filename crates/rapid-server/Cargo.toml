[package]
name = "rapid-server"
version = "0.1.8"
edition = "2024"
license = "MIT"
rust-version = "1.94"
description = "Axum runtime, OpenAPI and storage drivers for Lilyco Rapid applications"
repository = "https://github.com/Lyco-team/lilyco"

[features]
default = []
auth = ["dep:axum-login", "dep:tower-sessions", "dep:argon2", "dep:casbin", "dep:tower_governor", "dep:rand_core"]
http-store = ["dep:reqwest", "dep:rustls", "dep:url", "dep:webpki-roots", "tokio/time"]
mongodb = ["dep:mongodb"]
seaorm = ["sqlx-server", "dep:sea-orm"]
sqlx-server = ["dep:sqlx", "dep:url"]
surrealdb = ["http-store"]
turso = ["dep:libsql-hrana", "http-store"]

[dependencies]
async-trait = "0.1"
argon2 = { version = "0.5", optional = true }
rand_core = { version = "0.6.4", features = ["getrandom"], optional = true }
axum-login = { version = "0.19.0", optional = true }
casbin = { version = "2.20.0", optional = true }
tower-sessions = { version = "0.15.0", optional = true }
tower_governor = { version = "0.8.0", optional = true }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "mysql", "sqlite-bundled", "any"], optional = true }
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
libsql-hrana = { version = "0.10", optional = true }
mongodb = { version = "3.10.2", default-features = false, features = ["compat-3-3-0", "bson-3", "dns-resolver", "rustls-tls"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "sqlx-mysql", "sqlx-sqlite"], optional = true }
rapid-core = { version = "0.1.0", path = "../rapid-core", features = ["schema"] }
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = { version = "1.2", default-features = false, features = ["derive"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
toml = "0.8"
tower = { version = "0.5", features = ["limit", "util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
utoipa = "5.4"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
url = { version = "2", optional = true }
webpki-roots = { version = "1", optional = true }
