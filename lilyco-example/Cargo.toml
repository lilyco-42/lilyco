[package]
name = "lilyco-example"
version = "0.1.0"
edition = "2021"
description = "Lilyco demo — image compression tool"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"

[[bin]]
name = "imgpress"
path = "src/main.rs"

[dependencies]
lilyco-core = { path = "../lilyco-core" }
lilyco-macros = { path = "../lilyco-macros" }
lilyco-cli = { path = "../lilyco-cli" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
