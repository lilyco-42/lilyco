[package]
name = "lilyco-example"
version.workspace = true
edition = "2021"
description = "Lilyco demo — image compression tool"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"

[[bin]]
name = "imgpress"
path = "src/main.rs"

[[bench]]
name = "schema"
harness = false

[dependencies]
lilyco = { path = "../lilyco" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
lilyco-macros = { path = "../lilyco-macros" }
