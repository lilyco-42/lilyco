[package]
name = "lilyco-gui"
version = "0.2.3"
edition = "2021"
description = "Lilyco Web GUI — axum server with embedded HTML, Gradio-like experience"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"
keywords = ["web", "gui", "axum", "sse"]
categories = ["web-programming", "gui"]

[dependencies]
lilyco-core = { version = "0.2", path = "../lilyco-core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
async-stream = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
webbrowser = "1"
rand = "0.8"
