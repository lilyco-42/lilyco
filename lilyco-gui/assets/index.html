<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="lilyco-token" content="__TOKEN__">
<title>__CMD_NAME__ · lilyco 控制台</title>
<style>__CSS__</style>
</head>
<body>
<header class="topbar" data-component="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true">◆</span> lilyco <span class="brand-sub">Web 控制台</span></div>
  __CMD_NAV__
  <button type="button" id="theme-toggle" class="icon-btn" aria-label="切换深浅主题">◐</button>
</header>

<main class="page">
<section class="card">
  <h1 class="card-title">__CMD_NAME__</h1>
  <p class="card-about">__ABOUT__</p>

  <form id="form" novalidate>
__FIELDS__
    <div class="actions" data-component="run-bar">
      <button type="submit" id="run-btn" class="btn primary"><span class="btn-label">▶ 运行</span></button>
      <button type="button" id="cancel-btn" class="btn danger" hidden>■ 取消</button>
      <button type="button" id="copy-cli" class="btn ghost">复制 CLI</button>
    </div>
    <div class="cli-preview mono" id="preview" data-component="cli-preview" aria-live="off"></div>
  </form>

  <!-- 语义视图区：内容全部由后端声明、前端按协议渲染（可换成 shadcn 实现） -->
  <section id="views"__VIEWS_ATTR__ data-component="views" aria-live="polite">__VIEWS__</section>

  <section id="out" hidden data-component="output">
    <div class="out-head">
      <h2>输出</h2>
      <div class="progress" id="progress" data-indet="1" role="progressbar" aria-label="运行进度"
           aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" id="progress-bar"></div></div>
    </div>
    <div id="log" class="terminal" role="log" aria-live="polite" tabindex="0" data-component="log"></div>
    <div class="result-wrap" id="result-wrap" hidden data-component="result">
      <div class="result-head"><span>结果</span><button type="button" id="copy-result" class="btn-icon">复制</button></div>
      <!-- 可滚动区一律 tabindex=0 让键盘能滚（WCAG 2.1.1），与 #log 同一条规矩 -->
      <pre id="result" class="mono" role="region" aria-label="运行结果" tabindex="0"></pre>
    </div>
  </section>
</section>
<footer class="foot">lilyco · 本地回环会话 · 令牌随进程轮换</footer>
</main>

<script>
"use strict";
/* ═══ 行为层：一个组件一个 init ═══
   组件之间不互相摸 DOM，只通过四个公共函数通信：
     updatePreview()  重新生成 CLI 预览
     readForm()       表单 → 参数对象（预览与 /run 共用一份读表逻辑）
     logLine(cls,t)   往日志区追加一行
     setProgress(p)   进度条（null = 不确定）
   新增组件：写一个 initXxx，加进下面 BOOT 那一行，并在 DESIGN.md §10 补一条。 */
const TOKEN=document.querySelector('meta[name="lilyco-token"]').content;
const CMD=__CMD_JS__;
const SCHEMA_ARGS=__META__;
// 服务端登记过取消句柄才有这颗按钮；没有就别画（点了只得到一句 404）
const CANCELABLE=__CANCEL_JS__;
const $=id=>document.getElementById(id);
const qsa=sel=>Array.from(document.querySelectorAll(sel));
/* 装配清单：新增组件写一个 initXxx 并加进这里。
   真正的启动那一行在本文件**最末尾** —— 组件函数读的是下面的顶层 const，
   提前跑会撞上 TDZ（ReferenceError），而一个组件抛错会带走后面所有组件。 */
const BOOT=[initTheme,initCommandNav,initCliPreview,initDropzone,initPickButton,initList,
            initProgress,initLog,initResult,initRunBar];

/* ── 顶栏 · 主题切换 ── */
function initTheme(){
  const root=document.documentElement,btn=$("theme-toggle");
  const theme=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const saved=localStorage.getItem("lilyco-theme");
  if(saved)root.dataset.theme=saved;
  btn.setAttribute("aria-pressed",String(theme()==="dark"));
  btn.addEventListener("click",()=>{
    const next=theme()==="dark"?"light":"dark";
    root.dataset.theme=next;
    localStorage.setItem("lilyco-theme",next);
    btn.setAttribute("aria-pressed",String(next==="dark"));
  });
}

/* ── 顶栏 · 命令切换（单命令页面没有这个节点）── */
function initCommandNav(){
  const sel=$("cmd-nav");
  if(sel)sel.addEventListener("change",()=>{
    if(!sel.value)return;
    // 换命令要整页重载（表单是服务端按 schema 摊的）。重载期间先把下拉按住：
    // 一是给「已经在切了」一个看得见的答复，二是免得连点排出两次导航
    sel.disabled=true;
    sel.setAttribute("aria-busy","true");
    location.href="/?cmd="+encodeURIComponent(sel.value);
  });
}

/* ── CLI 预览 + 读表 ── */
function initCliPreview(){
  // input 会冒泡，所以动态加出来的行也在这里一并覆盖
  $("form").addEventListener("input",updatePreview);
  $("form").addEventListener("change",updatePreview);
  $("copy-cli").addEventListener("click",e=>copyText($("preview").textContent,e.currentTarget));
  updatePreview();
}
// 读表：Flag 恒有值（true/false），其余留空记为 null
function readForm(){
  const data={};
  for(const a of SCHEMA_ARGS){
    const el=$("field-"+a.name);
    if(a.kind==="Flag"){data[a.name]=!!(el&&el.checked);continue}
    if(a.kind==="List"){data[a.name]=listValues(a.name);continue}
    if(!el||el.value===""){data[a.name]=null;continue}
    data[a.name]=a.kind==="Number"?toNumber(el.value):el.value;
  }
  return data;
}
const toNumber=v=>{const n=Number(v);return isNaN(n)?v:n};
// 按 item 类型收值：Number 要发数字（服务端 validate_kind 的 Number 分支只认 as_f64，
// 发字符串会被一句「需要数字」打回），Flag 行未勾就等于这一项不存在
function listValues(name){
  const host=$("list-"+name);
  const kind=(host&&host.dataset.item)||"Text";
  const out=[];
  for(const el of qsa('[data-list-item="'+name+'"]')){
    if(kind==="Flag"){if(el.checked)out.push(true);continue}
    const v=el.value;
    if(v==="")continue;
    out.push(kind==="Number"?toNumber(v):v);
  }
  return out;
}
function cliLine(data){
  const parts=[CMD];
  for(const a of SCHEMA_ARGS){
    const v=data[a.name];
    if(v===null||v===false)continue;
    if(a.kind==="Flag"){parts.push("--"+a.name);continue}
    if(Array.isArray(v)){for(const x of v)parts.push("--"+a.name+" "+quoteIfSpaced(x));continue}
    parts.push("--"+a.name+" "+(a.kind==="Path"||String(v).includes(" ")?'"'+v+'"':v));
  }
  return parts.join(" ");
}
const quoteIfSpaced=x=>String(x).includes(" ")?'"'+x+'"':x;
function updatePreview(){$("preview").textContent=cliLine(readForm())}

/* ── 通用：复制并给一次性反馈（成功/失败都得说，静默复制等于没复制）── */
function copyText(text,btn){
  if(btn.dataset.copying)return;   // 反馈期间别再叠一层：两次定时器会互相把状态色抹掉
  btn.dataset.copying="1";
  const done=ok=>{
    const old=btn.dataset.label||btn.textContent;
    btn.dataset.label=old;btn.textContent=ok?"已复制":"复制失败";
    btn.classList.remove("copied","copy-failed");
    btn.classList.add(ok?"copied":"copy-failed");
    setTimeout(()=>{btn.textContent=old;btn.classList.remove("copied","copy-failed");delete btn.dataset.copying},1200);
  };
  // writeText 也可能同步抛（非安全上下文里 clipboard 就是 undefined）；不接住就永远卡在
  // data-copying=1，之后每次复制都被上面那道闸门吞掉
  try{navigator.clipboard.writeText(text).then(()=>done(true),()=>done(false))}catch(err){done(false)}
}

/* ── Path · 拖拽上传（拿到的是服务端暂存副本路径）── */
function initDropzone(){
  qsa(".dropzone").forEach(dz=>{
    const fi=dz.querySelector('input[type=file]');
    dz.querySelector(".dz-browse").addEventListener("click",()=>fi.click());
    // 拖拽区是容器，里面每个控件各管各的：点在空白处才算「选文件」
    dz.addEventListener("click",e=>{if(!e.target.closest("button,input,.dz-status"))fi.click()});
    fi.addEventListener("change",()=>{
      if(fi.files[0])uploadFile(fi.files[0],dz);
      fi.value="";  // 不清空的话，连着选同一个文件不再触发 change
    });
    const chip=dzParts(dz).chip;
    chip.addEventListener("click",()=>clearUpload(dz));
    dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("drag-over")});
    // 扫过子元素也会触发 dragleave，不判 relatedTarget 就会一直闪
    dz.addEventListener("dragleave",e=>{if(!dz.contains(e.relatedTarget))dz.classList.remove("drag-over")});
    dz.addEventListener("drop",e=>{
      e.preventDefault();dz.classList.remove("drag-over");
      const f=e.dataTransfer&&e.dataTransfer.files[0];
      if(f)uploadFile(f,dz);
    });
  });
}
function dzParts(dz){
  const name=dz.dataset.target;
  return {name,input:$("field-"+name),status:$("up-"+name),chip:$("chip-"+name)};
}
function setStatus(dz,cls,text){
  const s=dzParts(dz).status;
  s.textContent=text;s.className="dz-status"+(cls?" "+cls:"");
}
function fmtSize(n){return n>1048576?(n/1048576).toFixed(1)+" MB":n>1024?(n/1024).toFixed(1)+" KB":n+" B"}
function clearUpload(dz){
  const p=dzParts(dz);
  p.input.value="";p.chip.hidden=true;p.chip.textContent="";
  dz.classList.remove("uploaded");setStatus(dz,"","");updatePreview();
}
async function uploadFile(file,dz){
  const p=dzParts(dz);
  const fail=msg=>setStatus(dz,"err","上传失败："+msg);
  // 上限由服务端注入（data-max-upload），页面不抄第二份数字。
  // 必须在读文件之前拦：超限还去 FileReader 读 base64 会先吃光内存，
  // 硬发出去也只会被服务端掐断，浏览器报一句没头没尾的 Failed to fetch。
  const max=Number(dz.dataset.maxUpload)||0;
  if(max&&file.size>max){
    const hasPick=!!dz.querySelector("[data-pick]");
    // 报字节而不是只报 MB：209,715,201 B 和 209,715,200 B 都显示成「200.0 MB」，
    // 只给 MB 的话用户读到的是「200 MB 超过 200 MB」这种自相矛盾的话
    const bytes=n=>n.toLocaleString("en-US")+" B";
    fail(file.name+" 有 "+bytes(file.size)+"（"+fmtSize(file.size)+"），超过上传上限 "+bytes(max)+"（"+fmtSize(max)+"）—— 浏览器要把整个文件读成 base64 再发给服务端。"
      +(hasPick?"改点右边的「本机」—— 服务端直接弹系统选择器，回填原始路径，不复制也不限大小。"
               :"这条构建没开本机选择器：请手填路径，或换小一点的文件。"));
    return;
  }
  setStatus(dz,"busy","上传中 "+file.name+"（"+fmtSize(file.size)+"）…");
  try{
    const dataUrl=await new Promise((res,rej)=>{
      const r=new FileReader();
      r.addEventListener("load",()=>res(r.result));
      r.addEventListener("error",()=>rej(new Error("读取文件失败（"+file.name+"）")));
      r.readAsDataURL(file);
    });
    const b64=String(dataUrl).split(",",2)[1]||"";
    let resp;
    try{
      resp=await fetch("/upload",{method:"POST",headers:{"Content-Type":"application/json","X-Lilyco-Token":TOKEN},
        body:JSON.stringify({name:file.name,dataB64:b64})});
    }catch(netErr){
      // fetch 直接 reject = 请求根本没拿到响应：多半是 body 太大被服务端中途断开
      fail("传输被中断（"+netErr.message+"）。若文件较大，改点「本机」直接引用原始路径；否则重试一次。");
      return;
    }
    if(!resp.ok){
      const body=await resp.text().catch(()=>"");
      throw new Error(body?("HTTP "+resp.status+"："+body):("HTTP "+resp.status+"（服务端未给原因）"));
    }
    const j=await resp.json();
    p.input.value=j.path;
    p.chip.textContent=file.name+" · "+fmtSize(j.size);
    // 光有文件名+大小读屏不知道这是干什么的按钮，动作得进可访问名
    p.chip.setAttribute("aria-label","清除已上传的 "+file.name);
    p.chip.title="清除已上传的副本路径";
    p.chip.hidden=false;
    dz.classList.add("uploaded");
    setStatus(dz,"ok","已就绪：服务端路径已回填");
    updatePreview();
  }catch(err){fail(err.message||String(err))}
}

/* ── Path · 「本机」：服务端弹系统对话框，回填磁盘上的原始路径（不上传副本）── */
function initPickButton(){
  qsa("[data-pick]").forEach(btn=>btn.addEventListener("click",async()=>{
    const name=btn.getAttribute("data-pick"),field=$("field-"+name),status=$("up-"+name);
    if(!field)return;
    btn.disabled=true;
    if(status){status.textContent="等待系统对话框…（可能被压在后面，看一下任务栏）";status.className="dz-status busy"}
    try{
      const resp=await fetch("/pick",{method:"POST",headers:{"Content-Type":"application/json","X-Lilyco-Token":TOKEN},body:"{}"});
      const j=await resp.json();
      if(j.path){
        field.value=j.path;updatePreview();
        if(status){status.textContent="已选择："+j.path;status.className="dz-status ok"}
      }else if(status){status.textContent=j.error||"已取消";status.className="dz-status"}
    }catch(err){if(status){status.textContent="选择框失败："+err;status.className="dz-status err"}}
    finally{btn.disabled=false}
  }));
}

/* ── List · 动态行（初始行由服务端按 item 类型画好，这里只管增删）── */
// 模板 = 服务端画的第一行。JS 不另立「item 类型 → 控件」映射表（§8.1 的平行表）
const ROW_TMPL=new Map();
function initList(){
  qsa(".list-rows").forEach(host=>{
    const tmpl=host.querySelector(".list-row");
    if(tmpl)ROW_TMPL.set(host,tmpl);
  });
  qsa("[data-list-add]").forEach(btn=>btn.addEventListener("click",()=>addListRow(btn.dataset.listAdd)));
  qsa(".row-del").forEach(b=>b.addEventListener("click",e=>removeListRow(e.currentTarget)));
}
function listItemEl(row){return row.querySelector("[data-list-item]")}
// item 控件回初始值：类型读服务端标的 data-item-kind，不靠 tagName 重猜
function resetItem(el){
  if(el.dataset.itemKind==="Flag")el.checked=false;
  else if(el.dataset.itemKind==="Enum")el.selectedIndex=0;
  else el.value="";
}
function addListRow(name){
  const host=$("list-"+name);
  const tmpl=host&&ROW_TMPL.get(host);
  if(!tmpl)return null;
  const row=tmpl.cloneNode(true);
  for(const el of row.querySelectorAll("[data-list-item]"))resetItem(el);
  row.querySelector(".row-del").addEventListener("click",e=>removeListRow(e.currentTarget));
  host.append(row);
  listItemEl(row).focus();
  updatePreview();
  return row;
}
function removeListRow(node){
  const row=node.closest(".list-row"),host=row.closest(".list-rows");
  row.remove();
  // 删到最后一行也要能继续填：照模板补一行，控件类型仍跟着 item 走
  if(host&&!host.querySelector(".list-row"))addListRow(host.dataset.list);
  updatePreview();
}

/* ── 进度条 ── */
function initProgress(){setProgress(null);setProgressState(null)}
// p：null = 不确定态（服务端还没报比例），0..1 = 确定进度
function setProgress(p){
  const bar=$("progress"),fill=$("progress-bar");
  if(typeof p!=="number"||isNaN(p)){
    bar.dataset.indet="1";bar.removeAttribute("aria-valuenow");fill.style.width="";
    return;
  }
  const pct=Math.max(0,Math.min(100,p*100));
  bar.dataset.indet="0";bar.setAttribute("aria-valuenow",String(Math.round(pct)));
  fill.style.width=pct.toFixed(1)+"%";
}
// 收尾态：done 整条转绿，error 整条涂红，跑起来之前清空
function setProgressState(s){
  const bar=$("progress");
  if(s)bar.dataset.state=s;else bar.removeAttribute("data-state");
}

/* ── 日志区 ── */
const LOG_MAX_LINES=500;  // 长任务的 tick 能刷出上万行，得有个顶
function initLog(){const log=$("log");log.textContent="";log.scrollTop=0}
function logLine(cls,text){
  const log=$("log"),d=document.createElement("div");
  d.className=cls?"line "+cls:"line";
  d.textContent=text;
  log.appendChild(d);
  while(log.childElementCount>LOG_MAX_LINES)log.firstElementChild.remove();
  log.scrollTop=log.scrollHeight;
}

/* ── 结果区 ── */
function initResult(){
  clearResult();
  $("copy-result").addEventListener("click",e=>copyText($("result").textContent,e.currentTarget));
}
function clearResult(){
  $("result-wrap").hidden=true;
  $("result").textContent="";
}
function showResult(value){
  $("result").textContent=JSON.stringify(value,null,2);
  $("result-wrap").hidden=false;
}

/* ── 运行 / SSE / 取消 ── */
let es=null,activeSid=null;
function initRunBar(){
  $("form").addEventListener("submit",run);
  $("cancel-btn").addEventListener("click",cancel);
}
function setBusy(b){
  const btn=$("run-btn");
  btn.disabled=b;btn.classList.toggle("loading",b);btn.setAttribute("aria-busy",String(b));
  // cancel() 按下后会自禁，不在这里复原的话第二次运行它是「看得见但点不动」
  const cb=$("cancel-btn");
  cb.hidden=!(b&&CANCELABLE);cb.disabled=!b;
}
async function run(e){
  e.preventDefault();
  // 一次只跑一个。拿按钮的 disabled 当唯一闸门，不另立一个 running 标志：
  // setBusy(true) 在任何 await 之前同步发生，所以第二、第三次提交一定被挡。
  // （光靠 `if(es)` 挡不住 —— es 要等 /run 的 fetch 回来才赋值，
  //   实测连点三次 requestSubmit 就真发出三个 POST /run。）
  if($("run-btn").disabled||es)return;
  const data=readForm(),out=$("out");
  // 上一次的结论不清掉，日志在滚、结果区还写着旧 JSON —— 看着像这次运行刚出结果
  out.hidden=false;clearViews();initLog();clearResult();setProgress(null);setProgressState(null);setBusy(true);
  $("cancel-btn").disabled=true;  // sid 还没回来：这一下点了确实什么都没发生，先别让它能点
  out.scrollIntoView({block:"nearest"});  // 手机上运行按钮在表单底部，输出区在它下面
  let sid;
  try{
    const resp=await fetch("/run",{method:"POST",headers:{"Content-Type":"application/json","X-Lilyco-Token":TOKEN},
      body:JSON.stringify({args:data,cmd:CMD})});
    if(!resp.ok)throw new Error((await resp.text())||("HTTP "+resp.status));
    sid=(await resp.json()).session_id;activeSid=sid;
    $("cancel-btn").disabled=false;  // 有 sid 了，/cancel 才有点得到的东西
  }catch(err){
    // 请求就没成功，根本没有进度可等：把不确定态的跑动动画停下来，
    // 不然那条一直滚的进度条看着像「还在跑」
    logLine("err","请求失败："+err.message);setProgress(0);setBusy(false);return;
  }
  es=new EventSource("/progress/"+sid);
  es.addEventListener("message",ev=>{
    let p;try{p=JSON.parse(ev.data)}catch{return}
    applyEvent(p);
  });
  es.addEventListener("error",finish);  // 服务端关流也会走这里
}
/* ── 语义视图组件：后端声明 kind + 数据，这里只决定长什么样 ──
   换一套 UI（如 shadcn/ui）时替换 renderComponent 即可，后端与协议不改。 */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function vwrap(kind,inner,cls){return '<div class="v v-'+kind+(cls?" "+cls:"")+'" data-view-kind="'+kind+'">'+inner+'</div>'}
function vkids(cs){return (cs||[]).map(renderComponent).join("")}
function renderComponent(c){
  if(!c||!c.kind)return "";
  switch(c.kind){
    case "card":return vwrap("card",(c.title?'<div class="v-title">'+esc(c.title)+'</div>':"")+(c.description?'<div class="v-desc">'+esc(c.description)+'</div>':"")+vkids(c.children));
    case "separator":return '<div class="v v-sep" role="separator" data-view-kind="separator">'+(c.label?'<span>'+esc(c.label)+'</span>':"")+'</div>';
    case "progress":{
      const pct=(c.current!=null&&c.total)?Math.round(c.current/c.total*100):null;
      return '<div class="v v-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"'+(pct!=null?' aria-valuenow="'+pct+'"':"")+' data-indet="'+(pct==null?1:0)+'" data-view-kind="progress">'+
        (c.label?'<div class="v-progress-label">'+esc(c.label)+(pct!=null?' · '+pct+'%':"")+'</div>':"")+
        '<div class="v-progress-track"><div class="v-progress-bar" style="width:'+(pct==null?40:pct)+'%"></div></div></div>';
    }
    case "badge":return vwrap("badge",esc(c.text),c.tone||"neutral");
    case "alert":return vwrap("alert",'<div class="v-alert-title">'+esc(c.title)+'</div>'+(c.description?'<div class="v-alert-desc">'+esc(c.description)+'</div>':""),c.tone||"neutral");
    case "toast":return vwrap("toast",esc(c.text),c.tone||"neutral");
    case "skeleton":return vwrap("skeleton",Array.from({length:c.lines||3}).map(()=>'<div class="v-sk-line"></div>').join(""));
    case "key_value":return vwrap("key_value",(c.items||[]).map(it=>'<div class="v-kv-row"><span class="v-kv-k">'+esc(it.key)+'</span><span class="v-kv-v mono">'+esc(it.value)+'</span></div>').join(""));
    case "table":return vwrap("table",(c.caption?'<div class="v-desc">'+esc(c.caption)+'</div>':"")+'<table><thead><tr>'+(c.columns||[]).map(h=>'<th>'+esc(h)+'</th>').join("")+'</tr></thead><tbody>'+(c.rows||[]).map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join("")+'</tr>').join("")+'</tbody></table>');
    case "log":return vwrap("log",(c.lines||[]).map(l=>'<div class="line '+(l.level==="error"?"err":l.level==="warn"?"warn":"")+'">'+esc(l.text)+'</div>').join("")||'<div class="line">（无日志）</div>');
    case "result":return vwrap("result",'<div class="v-title">'+esc(c.title)+'</div>'+(c.value!=null?'<pre class="mono">'+esc(JSON.stringify(c.value,null,2))+'</pre>':""),c.ok?"success":"danger");
    case "button":return '<button type="button" class="btn v-btn '+(c.variant||"outline")+'" data-view-kind="button" data-action="'+esc(c.action)+'"'+(c.disabled?" disabled":"")+'>'+esc(c.label)+'</button>';
    /* 批 2 · 布局与导航 */
    case "section":return '<section class="v v-section" data-view-kind="section">'+(c.title?'<div class="v-title">'+esc(c.title)+'</div>':"")+vkids(c.children)+'</section>';
    case "scroll_area":return '<div class="v v-scroll" tabindex="0" data-view-kind="scroll_area"'+(c.max_height?' style="max-height:'+esc(c.max_height)+'"':"")+'>'+vkids(c.children)+'</div>';
    case "aspect_ratio":return '<div class="v v-aspect" data-view-kind="aspect_ratio" style="aspect-ratio:'+(c.ratio||1.6)+'">'+vkids(c.children)+'</div>';
    case "collapsible":return '<details class="v v-collapse" data-view-kind="collapsible"'+(c.open?" open":"")+'><summary>'+esc(c.title)+'</summary>'+vkids(c.children)+'</details>';
    case "accordion":return '<div class="v v-accordion" data-view-kind="accordion">'+((c.items||[]).map(it=>'<details'+(it.open?" open":"")+'><summary>'+esc(it.title)+'</summary><div class="v-desc">'+esc(it.body)+'</div></details>').join(""))+'</div>';
    case "tabs":return '<div class="v v-tabs" data-view-kind="tabs">'+'<div class="v-tablist" role="tablist">'+((c.items||[]).map(t=>'<span class="v-tab'+(t.id===c.active?" active":"")+'" role="tab" aria-selected="'+(t.id===c.active)+'">'+esc(t.label)+'</span>').join(""))+'</div>'+vkids(((c.items||[]).find(t=>t.id===c.active)||(c.items||[])[0]||{children:[]}).children)+'</div>';
    case "breadcrumb":return '<nav class="v v-crumb" data-view-kind="breadcrumb" aria-label="面包屑">'+((c.items||[]).map((x,i)=>'<span'+(i===(c.items||[]).length-1?' aria-current="page"':"")+'>'+esc(x)+'</span>').join('<span class="v-dot">/</span>'))+'</nav>';
    case "pagination":return '<nav class="v v-page" data-view-kind="pagination" aria-label="分页">第 '+esc(c.page)+' / '+esc(c.pages)+' 页</nav>';
    case "sidebar":return '<nav class="v v-sidebar" data-view-kind="sidebar" aria-label="侧栏">'+((c.items||[]).map(it=>'<span class="v-nav'+(it.id===c.active?" active":"")+'">'+esc(it.label)+'</span>').join(""))+'</nav>';
    case "resizable":return '<div class="v v-resize" data-view-kind="resizable" style="grid-template-columns:'+Math.round((c.ratio||0.5)*100)+'% 1fr">'+vkids(c.start)+vkids(c.end)+'</div>';
    case "carousel":return '<div class="v v-carousel" data-view-kind="carousel"><div class="v-desc">'+((c.index||0)+1)+' / '+((c.items||[]).length)+'</div>'+vkids(((c.items||[])[c.index||0]||{children:[]}).children)+'</div>';
    case "avatar":return '<div class="v v-avatar" data-view-kind="avatar" role="img" aria-label="'+esc(c.name)+'"><span>'+esc((c.name||"?").slice(0,1))+'</span></div>';
    case "chart":return '<div class="v v-chart" data-view-kind="chart" role="img" aria-label="图表">'+((c.series||[]).map((v,i)=>'<div class="v-bar" style="height:'+Math.max(2,Math.min(100,v))+'%"><span>'+esc((c.labels||[])[i]||"")+'</span></div>').join(""))+'</div>';
    /* 批 3 · 交互与浮层（浮层用原生 details/dialog，不引入任何运行时） */
    case "toggle":return '<button type="button" class="btn v-btn" data-view-kind="toggle" aria-pressed="'+!!c.pressed+'">'+esc(c.label)+'</button>';
    case "toggle_group":return '<div class="v v-group" data-view-kind="toggle_group" role="group">'+((c.options||[]).map(o=>'<span class="v-chip'+((c.selected||[]).includes(o)?" active":"")+'">'+esc(o)+'</span>').join(""))+'</div>';
    case "tooltip":return '<span class="v v-tip" data-view-kind="tooltip" title="'+esc(c.text)+'">'+vkids(c.children)+'</span>';
    case "hover_card":return '<details class="v v-hover" data-view-kind="hover_card"><summary>'+esc(c.trigger)+'</summary><div class="v-title">'+esc(c.title)+'</div><div class="v-desc">'+esc(c.body)+'</div></details>';
    case "dialog":return '<dialog class="v v-dialog" data-view-kind="dialog"'+(c.open?" open":"")+'>'+(c.description?'<div class="v-desc">'+esc(c.description)+'</div>':"")+vkids(c.children)+'<button type="button" class="btn-icon" data-close="1">关闭</button></dialog>';
    case "sheet":return '<dialog class="v v-dialog v-sheet '+esc(c.side||"right")+'" data-view-kind="sheet"'+(c.open?" open":"")+'>'+vkids(c.children)+'<button type="button" class="btn-icon" data-close="1">关闭</button></dialog>';
    case "drawer":return '<dialog class="v v-dialog" data-view-kind="drawer"'+(c.open?" open":"")+'>'+vkids(c.children)+'<button type="button" class="btn-icon" data-close="1">关闭</button></dialog>';
    case "alert_dialog":return '<dialog class="v v-dialog" data-view-kind="alert_dialog"'+(c.open?" open":"")+'>'+(c.description?'<div class="v-desc">'+esc(c.description)+'</div>':"")+'<div class="v-group"><span class="v-chip active">'+esc(c.confirm||"确认")+'</span><span class="v-chip">'+esc(c.cancel||"取消")+'</span></div><button type="button" class="btn-icon" data-close="1">关闭</button></dialog>';
    case "popover":return '<details class="v v-pop" data-view-kind="popover"'+(c.open?" open":"")+'><summary>'+esc(c.trigger)+'</summary>'+vkids(c.children)+'</details>';
    case "dropdown_menu":return '<details class="v v-pop" data-view-kind="dropdown_menu"><summary>'+esc(c.trigger)+'</summary><div class="v-menu">'+((c.items||[]).map(it=>'<span class="v-menu-item'+(it.danger?" danger":"")+'">'+esc(it.label)+'</span>').join(""))+'</div></details>';
    case "context_menu":return '<div class="v v-menu" data-view-kind="context_menu">'+((c.items||[]).map(it=>'<span class="v-menu-item'+(it.danger?" danger":"")+'">'+esc(it.label)+'</span>').join(""))+'</div>';
    case "menubar":return '<nav class="v v-menubar" data-view-kind="menubar">'+((c.menus||[]).map(g=>'<span class="v-nav">'+esc(g.label)+'</span>').join(""))+'</nav>';
    case "command":return '<div class="v v-command" data-view-kind="command">'+(c.query?'<div class="v-desc mono">> '+esc(c.query)+'</div>':"")+((c.items||[]).map(it=>'<div class="v-command-item"><span>'+esc(it.label)+'</span><span class="v-desc mono">'+esc(it.hint||"")+'</span></div>').join(""))+'</div>';
    case "navigation_menu":return '<nav class="v v-navmenu" data-view-kind="navigation_menu">'+((c.items||[]).map(it=>'<span class="v-nav'+(it.id===c.active?" active":"")+'">'+esc(it.label)+'</span>').join(""))+'</nav>';
    case "input":return '<label class="v-row" data-view-kind="input">'+esc(c.label||c.name)+'<input type="text" name="'+esc(c.name)+'" value="'+esc(c.value)+'" placeholder="'+esc(c.placeholder||"")+'"></label>';
    case "textarea":return '<label class="v-row" data-view-kind="textarea">'+esc(c.label||c.name)+'<textarea name="'+esc(c.name)+'" rows="'+(c.rows||3)+'">'+esc(c.value)+'</textarea></label>';
    case "select":return '<label class="v-row" data-view-kind="select">'+esc(c.label||c.name)+'<select name="'+esc(c.name)+'">'+((c.options||[]).map(o=>'<option'+(o===c.value?" selected":"")+'>'+esc(o)+'</option>').join(""))+'</select></label>';
    case "checkbox":return '<label class="v-row" data-view-kind="checkbox"><input type="checkbox"'+(c.checked?" checked":"")+' name="'+esc(c.name)+'">'+esc(c.label)+'</label>';
    case "radio_group":return '<div class="v v-group" data-view-kind="radio_group" role="radiogroup">'+((c.options||[]).map(o=>'<label class="v-chip'+(o===c.selected?" active":"")+'"><input type="radio" name="'+esc(c.name)+'"'+(o===c.selected?" checked":"")+'>'+esc(o)+'</label>').join(""))+'</div>';
    case "switch":return '<label class="v-row" data-view-kind="switch"><input type="checkbox" role="switch"'+(c.checked?" checked":"")+'>'+esc(c.label)+'</label>';
    case "slider":return '<label class="v-row" data-view-kind="slider">'+esc(c.label||c.name)+'<input type="range" min="'+(c.min||0)+'" max="'+(c.max||100)+'" value="'+(c.value||0)+'"></label>';
    case "combobox":return '<label class="v-row" data-view-kind="combobox">'+esc(c.label||c.name)+'<input type="text" list="'+esc(c.name)+'-opts" value="'+esc(c.value)+'"><datalist id="'+esc(c.name)+'-opts">'+((c.options||[]).map(o=>'<option value="'+esc(o)+'">').join(""))+'</datalist></label>';
    case "input_otp":return '<div class="v v-otp" data-view-kind="input_otp">'+Array.from({length:c.length||6}).map((_,i)=>'<input type="text" maxlength="1" inputmode="numeric" value="'+esc((c.value||"")[i]||"")+'" aria-label="第 '+(i+1)+' 位">').join("")+'</div>';
    case "calendar":return '<div class="v v-cal" data-view-kind="calendar" aria-label="'+esc(c.month)+'">'+esc(c.month)+((c.marked||[]).map(d=>'<span class="marked">'+esc(d)+'</span>').join(""))+'</div>';
    case "date_picker":return '<label class="v-row" data-view-kind="date_picker">'+esc(c.label||c.name)+'<input type="date" value="'+esc(c.value||"")+'"></label>';
    case "form":return '<div class="v v-form" data-view-kind="form">'+(c.submit?'<div class="v-title">'+esc(c.submit)+'</div>':"")+vkids(c.children)+'</div>';
    case "label":return '<div class="v v-label" data-view-kind="label"'+(c.html_for?' for="'+esc(c.html_for)+'"':"")+'>'+esc(c.text)+'</div>';
    default:return '<div class="v v-unknown" data-view-kind="'+esc(c.kind)+'"><div class="v-desc">未识别组件：'+esc(c.kind)+'</div><pre class="mono">'+esc(JSON.stringify(c,null,2))+'</pre></div>';
  }
}
function showView(id,c){
  const host=$("views");host.hidden=false;
  let box=Array.from(host.children).find(x=>x.dataset.viewId===id);
  if(!box){box=document.createElement("section");box.className="view";box.dataset.viewId=id;host.appendChild(box);}
  box.innerHTML=renderComponent(c);
  // 原生浮层的关闭：<dialog> 要 close() 才退出 open 态；<details> 本来就能折叠
  for(const btn of Array.from(box.querySelectorAll("[data-close]"))){
    btn.addEventListener("click",()=>{const d=btn.closest("dialog");if(d)d.close()});
  }
  // data-view-kind 供验收脚本统计；这里也读一次，保证属性有读者
  const kinds=Array.from(box.querySelectorAll("[data-view-kind]")).map(x=>x.dataset.viewKind);
  box.dataset.rendered=kinds.length;
}
function placeholder(title,kind){return '<div class="v v-skeleton" data-view-placeholder="1" data-view-kind-hint="'+esc(kind||"")+'">'+(title?'<div class="v-title">'+esc(title)+'</div>':"")+'<div class="v-sk-line"></div><div class="v-sk-line"></div></div>'}
function clearViews(){
  const h=$("views");if(!h)return;
  const boxes=Array.from(h.querySelectorAll("[data-view-id]"));
  h.hidden=boxes.length===0;
  // 静态槽位要保留：只把内容退回骨架，运行时按 id 原位替换
  for(const box of boxes){box.innerHTML=placeholder(box.dataset.viewTitle||"",box.dataset.viewKindHint||"")}
}

function applyEvent(p){
  switch(p.type){
    case "started":logLine(null,p.message||"运行中…");break;
    case "tick":setProgress(p.percent);if(p.message)logLine(null,p.message);break;
    case "log":logLine(p.level==="error"?"err":p.level==="warn"?"warn":null,"["+(p.level||"info")+"] "+p.message);break;
    case "telemetry":logLine("tele",p.key+" = "+JSON.stringify(p.value));break;
    case "view":showView(p.id,p.component);break;
    case "done":setProgress(1);setProgressState("done");showResult(p.result);finish();break;
    // 失败也走满条并涂红：留个 0% 的空条，看上去像什么都没发生
    case "error":setProgress(1);setProgressState("error");logLine("err","ERROR: "+p.message);finish();break;
  }
}
function finish(){if(es){es.close();es=null}activeSid=null;setBusy(false)}
async function cancel(){
  if(!activeSid)return;
  const btn=$("cancel-btn");
  btn.disabled=true;
  try{
    const resp=await fetch("/cancel/"+activeSid,{method:"POST",headers:{"X-Lilyco-Token":TOKEN}});
    if(!resp.ok)throw new Error((await resp.text())||("HTTP "+resp.status));
    logLine("warn","已发送取消请求（命令需响应 ctx.is_cancelled）");
  }catch(err){
    logLine("err","取消失败："+err.message);btn.disabled=false;  // 失败了才值得再点一次
  }
}

/* ═══ 装配 ═══
   放在最后：所有顶层常量此时都已初始化，函数声明本来就提升。
   每个组件单独 try —— 一个组件的毛病不该把整台控制台带走；但失败必须看得见，
   半死的页面（看着正常、点了不动）是最难报的 bug。 */
const bootFailures=[];
for(const init of BOOT){
  try{init()}catch(err){bootFailures.push((init.name||"组件")+": "+err.message)}
}
if(bootFailures.length){
  const d=document.createElement("div");
  d.className="line err";
  d.textContent="组件装配失败，页面功能不完整：" + bootFailures.join("；");
  $("out").hidden=false;
  $("log").appendChild(d);
  console.error(bootFailures.join("\n"));
}
</script>
