[package]
name = "triforge-gui"
version = "0.1.0"
edition = "2021"
description = "Triforge Web GUI —— Axum + 嵌入式 HTML，类似 Gradio 的体验"

[dependencies]
triforge-core = { path = "../triforge-core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
async-stream = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
