[package]
name = "lilyco-srt"
version = "0.1.0"
edition = "2021"
description = "Auto-subtitle videos: faster-whisper ASR + ffmpeg burn-in. One struct, four ends (CLI/TUI/Web/MCP)."

[[bin]]
name = "lsrt"
path = "src/main.rs"

[dependencies]
lilyco = { path = "../lilyco" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
