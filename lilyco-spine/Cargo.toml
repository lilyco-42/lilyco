[package]
name = "lilyco-spine"
version = "0.1.0"
edition = "2021"
description = "Local Spine asset metadata inspector for Lilyco AI/MCP clients; no proprietary runtime bundled"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"

[[bin]]
name = "lspine"
path = "src/main.rs"

[dependencies]
lilyco = { path = "../lilyco", default-features = false }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
