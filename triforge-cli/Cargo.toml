[package]
name = "triforge-cli"
version = "0.1.0"
edition = "2021"
description = "Triforge CLI renderer — generates clap::Command from CommandSchema"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"
keywords = ["cli", "clap", "schema", "ai"]
categories = ["command-line-interface"]

[dependencies]
triforge-core = { path = "../triforge-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
