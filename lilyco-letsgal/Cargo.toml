[package]
name = "lilyco-letsgal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AI-assisted LetsGal Studio creation — story DSL compiler to LetsGal project. Four interfaces (CLI/TUI/Web/MCP) + AI-callable by default."
rust-version = "1.75"

[[bin]]
name = "lletsgal"
path = "src/main.rs"

[dependencies]
lilyco = { path = "../lilyco" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
md5 = "0.7"

[dev-dependencies]
tempfile = "3"
