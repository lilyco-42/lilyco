[package]
name = "lilyco-web2cli"
version = "0.3.2"
edition = "2021"
description = "Convert any webpage, form, OpenAPI spec, or HAR trace into a Lilyco 4-interface app (CLI / TUI / Web / MCP)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"
keywords = ["cli", "web2cli", "scraper", "openapi", "mcp"]
categories = ["command-line-interface", "web-programming"]

[[bin]]
name = "lweb2cli"
path = "src/main.rs"

[dependencies]
lilyco = { version = "0.3", path = "../lilyco", default-features = false }
lilyco-license = { version = "0.1", path = "../lilyco-license" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml = "0.8"
ureq = "3"
url.workspace = true
regex = "1"
scraper.workspace = true
ego-tree = "0.10"
cookie.workspace = true
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
base64.workspace = true
tempfile = "3"
axum = { workspace = true, features = ["multipart"], optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }

[features]
default = ["cloudflare"]
cloudflare = []
full = ["lilyco/full", "server"]
tui = ["lilyco/tui"]
web = ["lilyco/web"]
server = ["dep:axum", "dep:tokio", "dep:image"]
