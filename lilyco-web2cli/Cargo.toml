[package]
name = "lilyco-web2cli"
version = "0.3.0"
edition = "2021"
description = "Convert any webpage, form, OpenAPI spec, or HAR trace into a Lilyco 4-interface app (CLI / TUI / Web / MCP)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilyco-42/lilyco"
keywords = ["cli", "web2cli", "scraper", "openapi", "mcp"]
categories = ["command-line-interface", "web-programming"]

[[bin]]
name = "lweb2cli"
path = "src/main.rs"

[dependencies]
lilyco = { version = "0.3", path = "../lilyco", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = "3"
url = "2"
regex = "1"
html5ever = "0.39"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
base64 = "0.23"
ring = "0.17"
axum = { version = "0.8", features = ["multipart"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }

[features]
default = []
full = ["lilyco/full", "server"]
tui = ["lilyco/tui"]
web = ["lilyco/web"]
server = ["dep:axum", "dep:tokio", "dep:image"]

[dev-dependencies]
tempfile = "3"
