[workspace]
members = ["core", "server"]
exclude = ["ops/lilyco-no_std"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
axum = "0.8"
schemars = { version = "1.2", default-features = false, features = ["derive"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = "1"
thiserror = "2"
lilyco-no_std = { path = "../lilyco-no_std", default-features = false }
tokio = "1"

[profile.release]
strip = true
lto = "thin"
