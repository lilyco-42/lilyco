services:
  api:
    environment:
      RAPID_DATABASE_URL: mysql://rapid:${RAPID_DB_PASSWORD:?missing local database password}@database:3306/rapid?ssl-mode=required
    depends_on:
      database:
        condition: service_healthy
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_USER: rapid
      MYSQL_DATABASE: rapid
      MYSQL_PASSWORD: ${RAPID_DB_PASSWORD:?missing local database password}
      MYSQL_ROOT_PASSWORD: ${RAPID_DB_ROOT_PASSWORD:?missing local root password}
    ports:
      - "127.0.0.1::3306"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 4s
      retries: 30
volumes:
  database:
